function navHTML(){return pages.map(([key,label,ico])=>{let count=key==='review'?state.films.filter(f=>reviewStates.includes(f.status)).length:key==='exceptions'?state.films.filter(f=>exceptionStates.includes(f.status)).length:null;return `<a href="#${key}" data-nav="${key}" ${state.page===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${count!==null?`<span class="nav-count">${count}</span>`:''}</a>`}).join('')}
function heading(eyebrow,title,description,actions=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function button(label,action,extra='',kind=''){return `<button class="btn ${kind}" data-action="${action}" ${extra}>${label}</button>`}

function progress(f,expanded=false){const isLtx=['encode','denoise'].includes(f.status);if(!isLtx){const text={translate:'中文翻译 · 112 / 240 条字幕',return:'成品包回传 · 3 / 4 个文件已校验',scrape:'正在读取 NFO 与封面',match:'正在比对演员索引与别名',inbox:'等待符合分辨率的设备领取'}[f.status]||statusMeta[f.status][0];return `<div class="film-stage"><span>${esc(text)}</span></div><div class="stage-detail"><span>${f.status==='return'?'传输计数与影片流程进度分开显示':'此阶段不提供影片总体百分比'}</span></div>`}return `<div class="film-stage"><strong class="green">${f.status==='encode'?'Encode / 编码':'Denoise / 去噪'}</strong><span class="mono">${f.percent}% <span class="muted small">本阶段</span></span></div><div class="progress" role="progressbar" aria-label="${esc(f.title)} ${f.status} 本阶段进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${f.percent}"><span style="width:${f.percent}%"></span></div><div class="stage-detail"><span class="mono">${f.current} / ${f.total} ${f.status==='encode'?'帧':'步'}</span><span class="mono">${f.rate} ${f.unit}</span></div>${expanded?`<div class="mini-metrics"><div><label>阶段速率</label><strong>${f.rate} <small>${f.unit}</small></strong></div><div><label>阶段已用</label><strong>${f.elapsed}</strong></div><div><label>阶段剩余</label><strong>${f.eta}</strong></div></div><div class="divider"></div><div class="keyline">LTX 本次运行剩余 <strong class="mono blue">${f.runEta}</strong></div><p class="small muted spacer-top">由阶段日志提供；不包含翻译、回传、刮削与入库。未观测到的阶段不会显示“已完成”。</p>`:''}`}
function row(f){return `<article class="film-row">${cover(f)}<div class="film-body"><div class="film-title"><h3>${esc(f.title)}</h3><span class="chip">${f.resolution}</span></div><div class="meta"><span class="mono">${f.id}</span><span>${f.device||'主控编排'}</span><span>演示影片</span></div>${progress(f)}</div><button class="btn ghost icon-btn" data-action="detail" data-id="${f.id}" aria-label="查看 ${esc(f.title)} 详情">${icon('chevron')}</button></article>`}
function overview(){const active=state.films.filter(f=>activeStates.includes(f.status)),review=state.films.filter(f=>reviewStates.includes(f.status)),exceptions=state.films.filter(f=>exceptionStates.includes(f.status));return heading('WORKFLOW / 全局工作流','让每一部影片，顺利归位。','从人工投片到验证入库，持续处理；只在演员与目标路径需要您决定时停下。',button(`${icon(state.paused?'play':'pause')}${state.paused?'恢复新领取':'暂停新领取'}`,'pause','','ghost')+button(`待确认 <span class="mono">${review.length}</span>${icon('arrow')}`,'nav','data-page="review"','primary'))+(state.paused?'<div class="notice amber">'+icon('pause')+'<div><strong>主控已暂停新领取</strong><p>在途修复、翻译、回传与已确认入库继续运行。各设备的本机停止需在本机操作。</p></div></div>':'')+`<div class="stats"><div class="panel stat"><div class="label">正在处理${icon('spark')}</div><strong>${active.length}<em>部影片</em></strong><div class="note">2 部 LTX · 其余步骤分别计数</div></div><div class="panel stat"><div class="label">等待您的确认${icon('review')}</div><strong class="amber">${review.length}<em>部影片</em></strong><div class="note">按影片核对演员与最终路径</div></div><div class="panel stat"><div class="label">需要处理${icon('alert')}</div><strong>${exceptions.length}<em>项异常</em></strong><div class="note">含入库未知、来源清理待重试</div></div><div class="panel stat"><div class="label">计算设备${icon('device')}</div><strong>5<em>/ 5 在线</em></strong><div class="note">2 × 16 GB · 3 × 8 GB</div></div></div><div class="flow-strip" aria-label="各流程阶段影片数量">${[['收件',state.films.filter(f=>f.status==='inbox').length,'inbox'],['修复 / 字幕',state.films.filter(f=>['encode','denoise','translate'].includes(f.status)).length,'processing'],['回传 / 刮削',state.films.filter(f=>['return','scrape','match'].includes(f.status)).length,'preparing'],['待确认',review.length,'review'],['入库 / 清理',state.films.filter(f=>['unknown','cleanup'].includes(f.status)).length,'archive'],['完成',state.films.filter(f=>f.status==='completed').length,'completed']].map(([name,count,key])=>`<button class="flow-stage ${key==='review'?'attention':''}" data-action="flow" data-filter="${key}"><span>${name}</span><b>${count}</b></button>`).join('')}</div><div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>正在处理</h2><p>当前阶段与设备 · 不合成影片总体百分比</p></div><button class="link-btn" data-action="nav" data-page="queue">全部队列${icon('arrow')}</button></div><div class="film-list">${active.slice(0,4).map(row).join('')}</div><div class="queue-summary"><span>另有 ${Math.max(0,active.length-4)} 部正在刮削 / 匹配</span><span class="mono">FIXTURE / 静态快照</span></div></section><section class="panel"><div class="panel-head"><div><h2>安全抵达之后，再清理来源</h2><p>正式片库永不作为清理目标</p></div>${icon('shield')}</div><div class="panel-body"><div class="steps-list no-margin"><span class="step">确认目标与清单</span><span class="step">不覆盖提交</span><span class="step">完整校验与回执</span><span class="step">来源身份复核</span><span class="step">清理清单内原片</span></div></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><div><h2>下一步，需要您</h2><p>图文核对 · 一部一确认</p></div><span class="chip amber">${review.length} 待确认</span></div>${review.slice(0,2).map(f=>`<div class="review-peek"><div class="top">${cover(f)}<div><h3>${f.title}</h3><p>${f.actor} · ${f.resolution}</p>${status(f)}</div></div><div class="actions">${button(`核对入库${icon('arrow')}`,'review',`data-id="${f.id}"`,f.status==='ready'?'primary small':'small')}</div></div>`).join('')||'<div class="empty">待确认已处理</div>'}</section><section class="panel"><div class="panel-head"><h2>设备协作</h2><button class="link-btn" data-action="nav" data-page="devices">查看${icon('arrow')}</button></div>${devices.map(d=>`<div class="device-mini"><div class="device-meta"><span class="device-icon">${icon(d.local?'local':'device')}</span><div><div class="name">${d.gpu} <span class="muted">${d.vram}</span></div><div class="desc">${d.id}${d.local?' · 本机 + 主控':''}</div></div></div><span class="chip ${d.vram==='16 GB'?'blue':''}">${d.vram==='16 GB'?'4K 优先':'仅 1080p'}</span></div>`).join('')}</section></div></div>`}
function matchesStage(f){return state.stage==='all'||state.stage===f.status||(state.stage==='processing'&&['encode','denoise','translate'].includes(f.status))||(state.stage==='preparing'&&['return','scrape','match'].includes(f.status))||(state.stage==='review'&&reviewStates.includes(f.status))||(state.stage==='archive'&&['unknown','cleanup'].includes(f.status))}
function card(f){return `<article class="panel film-card"><div class="top">${cover(f)}<div class="film-body"><div class="film-title"><h3>${f.title}</h3></div><div class="meta"><span>${f.id} · ${f.resolution}</span></div><div class="meta">${f.actor}</div><div style="margin-top:8px">${status(f)}</div></div></div>${progress(f)}<div class="card-foot"><span>${f.device||f.source}</span>${button('查看详情','detail',`data-id="${f.id}"`,'ghost small')}</div></article>`}
function queue(){let films=state.films.filter(f=>matchesStage(f)&&(state.resolution==='all'||f.resolution===state.resolution)&&`${f.title} ${f.id} ${f.actor}`.toLowerCase().includes(state.search.toLowerCase()));return heading('FILM QUEUE / 影片队列','每部影片，一条完整记录。','修复、字幕、回传与归档共享影片身份；原始输入与处理后的成品包分别记录。',button(`${icon('folder')}收件规则`,'nav','data-page="settings"','ghost'))+`<div class="toolbar"><div class="filters"><select id="stage-filter" aria-label="按影片阶段筛选">${[['all','全部阶段'],['inbox','收件待领取'],['processing','修复 / 字幕'],['preparing','回传 / 刮削 / 匹配'],['review','待确认'],['archive','入库 / 来源清理'],['completed','已完成'],['skipped','已跳过']].map(([v,l])=>`<option value="${v}" ${state.stage===v?'selected':''}>${l}</option>`).join('')}</select><select id="resolution-filter" aria-label="按分辨率筛选"><option value="all">全部分辨率</option><option ${state.resolution==='4K'?'selected':''}>4K</option><option ${state.resolution==='1080p'?'selected':''}>1080p</option></select><span class="chip">${films.length} 部</span></div><div class="search-wrap">${icon('search')}<input class="input search" id="film-search" type="search" placeholder="搜索影片、演员或编号" aria-label="搜索影片、演员或编号" value="${esc(state.search)}"></div></div><div class="queue-grid">${films.map(card).join('')}</div>${!films.length?empty('没有符合条件的影片','试试更改阶段、分辨率或搜索词。'):''}`}
function empty(title,description){return `<div class="panel empty">${icon('check')}<h2>${title}</h2><p>${description}</p></div>`}
function reviewPage(){let items=state.films.filter(f=>reviewStates.includes(f.status));if(state.reviewFilter==='ready')items=items.filter(f=>f.status==='ready');if(state.reviewFilter==='blocked')items=items.filter(f=>f.status!=='ready');return heading('HUMAN REVIEW / 待确认','最后一步，由您确认。','按影片查看封面与演员，核对目标 NAS、库根和文件包。一次确认授权入库成功后清理指定收件来源。')+`<div class="notice">${icon('shield')}<div>NAS 正式片库禁止覆盖和删除。原片只在成品完整入库、回执校验和输入身份复核全部通过后清理。</div></div><div class="toolbar"><div class="filters">${[['all','全部待确认'],['ready','可核对入库'],['blocked','需要先处理']].map(([v,l])=>`<button class="filter-pill" data-action="review-filter" data-filter="${v}" aria-pressed="${state.reviewFilter===v}">${l}</button>`).join('')}</div><span class="small muted">${items.length} 部影片 · 每次单独确认</span></div><div class="review-grid">${items.map(f=>`<article class="panel review-card">${cover(f)}<div class="film-body"><div class="film-title"><h3>${f.title}</h3><span class="chip">${f.resolution}</span></div><p>${f.id} · ${f.actor}</p>${status(f)}<div class="keyline">${icon('library')}<span class="wrap">${f.root?`NAS-${f.root[0]} / 库根 ${f.root}`:'尚未选定目标'}</span></div><p>${({ready:'成品包 4 个文件 · 来源清单 3 个文件',multi:'2 个演员 / 目录候选，必须明确选择',nomatch:'可人工指定目标或接管，来源会保留',offline:'NAS-D 离线，禁止提交',permission:'目标目录不可写，禁止提交',duplicate:'目标存在同名包，禁止覆盖'})[f.status]}</p><div class="actions">${button(f.status==='ready'?'图文核对入库':'查看并处理','review',`data-id="${f.id}"`,f.status==='ready'?'primary small':'small')}</div></div></article>`).join('')}</div>${!items.length?empty('当前没有待确认影片','已确认的影片可在队列中查看入库回执与清理结果。'):''}`}
function exceptionInfo(f){return {offline:['NAS-D 暂时不可达','尚未写入目标。连接恢复后重新预检，仍需您核对目标。','模拟恢复并预检'],permission:['目标目录缺少写入权限','尚未写入目标；不会提权、替换或删除已有目录。','模拟权限恢复并预检'],duplicate:['目标已有同名影片包','与演示目标校验值不同。禁止覆盖；请人工核对已有包。','核对冲突'],unknown:['提交后连接中断，结果未知','先查目标和入库回执，不能直接重新上传或清理来源。','先核对入库结果'],cleanup:['成品已验证入库，来源清理被占用阻挡',f.snapshotOnly?'普通 SMB 快照完整性未证明，来源必须保留。':f.cleanupChanged?'输入身份已经变化，旧授权禁止清理。':'回执完整。重试只针对原始输入清单。','仅重试来源清理'],stopped:['本机任务已停止','影响仅限 GPU-05；原始来源与已完成阶段结果保留。','重新排队']}[f.status]}
function exceptions(){let items=state.films.filter(f=>exceptionStates.includes(f.status));if(state.exceptionFilter==='unknown')items=items.filter(f=>f.status==='unknown');if(state.exceptionFilter==='cleanup')items=items.filter(f=>f.status==='cleanup');return heading('EXCEPTIONS / 异常中心','停在可恢复的位置。','失败不会变成重复入库；“已入库”与“原片已清理”分别记录。跳过与人工接管都会保留来源。')+`<div class="toolbar"><div class="filters">${[['all','所有异常'],['unknown','入库结果未知'],['cleanup','仅需清理来源']].map(([v,l])=>`<button class="filter-pill" data-action="exception-filter" data-filter="${v}" aria-pressed="${state.exceptionFilter===v}">${l}</button>`).join('')}</div></div>${items.map(f=>{const [title,desc,action]=exceptionInfo(f);return `<article class="panel exception-card"><div class="summary"><span class="exception-symbol">${icon('alert')}</span><div><div class="film-title"><h3>${title}</h3>${status(f)}</div><p><strong>${f.title}</strong> · ${f.id} · ${f.resolution}</p><p>${desc}</p></div></div><div class="actions">${button(action,'exception',`data-id="${f.id}"`,'small')}${button('更多','exception-more',`data-id="${f.id}"`,'ghost small')}</div></article>`}).join('')}${!items.length?empty('当前筛选没有异常','处理结果会保留在影片详情的事件记录中。'):''}`}
function deviceCard(d){const f=d.local?(state.localDemo?film(state.localDemo):null):film(d.job),isLocalPaused=d.local&&(state.localPaused||state.localDraining);return `<article class="panel device-card"><div class="device-top"><div class="device-name"><span class="device-icon">${icon(d.local?'local':'device')}</span><div><h3>${d.name}</h3><p>${d.id} · ${d.gpu} · ${d.vram}</p></div></div><span class="chip ${isLocalPaused?'amber':'green'}">${isLocalPaused?'本机停止领取':'在线'}</span></div><div class="metric-grid"><div><label>GPU 使用率 · 演示</label><strong>${d.local&&f&&f.status!=='stopped'?'72':d.load}<small> %</small></strong></div><div><label>显存容量</label><strong>${d.vram}</strong></div><div><label>任务资格</label><strong class="text-value ${d.vram==='16 GB'?'blue':''}">${d.vram==='16 GB'?'4K 优先':'仅 1080p'}</strong></div></div><div class="assign"><span>${f?`${f.title} · ${statusMeta[f.status][0]}`:'暂无在途任务'}</span>${button(d.local?'查看本机':'任务详情',d.local?'nav':'detail',d.local?'data-page="local"':`data-id="${d.job}"`,'ghost small')}</div></article>`}
function devicesPage(){return heading('DEVICES / 设备协作','五台设备，各司其职。','2 台 16 GB 显卡优先处理 4K；3 台 8 GB 显卡只领取 1080p。主控电脑也是其中一台 Agent。')+`<div class="notice">${icon('info')}<div>Mac 信息桥单独展示只读信息，不计入这 5 台计算设备，也不接受影片任务。暂停新领取不终止在途任务。</div></div><div class="device-grid">${devices.map(deviceCard).join('')}</div>`}
function localPage(){const d=devices[4],f=state.localDemo?film(state.localDemo):null;return heading('LOCAL AGENT / 本机','主控电脑，也是您的本机 Agent。','GPU-05 · Windows · RTX 5060 8 GB。这一页只控制本机任务；其他四台设备继续独立运行。',button(state.localDraining?'取消本机排空':'本机排空','local-drain','','ghost')+button(`${icon(state.localPaused?'play':'stop')}${state.localPaused?'恢复本机领取':'停止本机任务'}`,'local-control','','danger'))+`<div class="notice ${state.localPaused?'amber':''}">${icon('local')}<div>${state.localPaused?'本机已停止领取；其他设备与 Hub 主控继续运行。':state.localDraining?'本机正在排空：在途任务继续，只停止本机新的领取。':'本机兼任主控与 GPU Agent，不需要另一套窗口或第二份设备卡。'}</div></div><div class="two-col"><div class="stack">${deviceCard(d)}<section class="panel"><div class="panel-head"><h2>本机任务</h2><span class="chip">只显示 GPU-05</span></div>${f?row(f):`<div class="empty"><h2>本机当前空闲</h2><p>全局队列中的 4K 影片不会派给这台 8 GB 设备。</p><div class="actions" style="justify-content:center;margin-top:18px">${button('载入本机 1080p 演示任务','local-demo',state.localPaused||state.localDraining?'disabled':'','ghost')}</div></div>`}</section></div><section class="panel"><div class="panel-head"><h2>两个控制范围</h2></div><div class="panel-body"><h3>主控 · 暂停新领取</h3><p class="small muted spacer-top">作用于全局调度，只阻止新的领取；不会杀死在途任务。</p><div class="divider"></div><h3>本机 · 排空 / 停止任务</h3><p class="small muted spacer-top">排空只阻止本机新领取，在途任务继续。停止则终止 GPU-05 的任务并暂停领取，保留来源；其他机器与 Hub 继续。</p><div class="divider"></div><button class="link-btn" data-action="nav" data-page="overview">回到全局工作流${icon('arrow')}</button></div></section></div>`}
function libraries(){return heading('LIBRARIES & RULES / 片库与规则','目标明确，正式片库受保护。','4 个虚构 NAS，16 个逻辑库根。这里只展示演示别名，不包含真实 UNC、凭据或片源路径。',button(`${icon('settings')}目录映射向导`,'nav','data-page="settings"','ghost'))+`<div class="library-grid">${['A','B','C','D'].map((letter,index)=>`<section class="panel"><div class="panel-head"><div><h2>NAS-${letter}</h2><p>逻辑连接 · 目标库根 4 个</p></div><span class="chip ${letter==='D'&&!state.nasRestored?'red':'green'}">${letter==='D'&&!state.nasRestored?'演示：离线':'演示：在线'}</span></div><div class="panel-body"><div class="root-list">${[1,2,3,4].map(n=>`<div class="root-item"><strong>${letter}0${n}</strong> · 演示库根<p>演员目录 / 影片包</p><p>${letter==='C'&&n===3&&!state.permissionRestored?'演示：写入受限':'禁止覆盖 · 禁止库内删除'}</p></div>`).join('')}</div><button class="link-btn spacer-top" data-action="actor-index" data-nas="${letter}">查看演示演员索引${icon('arrow')}</button></div></section>`).join('')}</div><section class="panel spacer-top"><div class="panel-head"><h2>入库与来源清理规则</h2>${icon('shield')}</div><div class="panel-body rule-list">${[['输入与成品分开建清单','原始收件影片、既有 NFO / srt 与处理成品拥有独立身份，不能把成品目录当作原片目录。'],['先验证完整入库，再清理','目标文件包须完整校验、生成持久回执，再检查原始输入身份；确认后才删除清单内来源文件。'],['只重试未完成的清理','来源被占用或机器离线时保留“已入库 · 待清理”；恢复后不重新修复、刮削或上传。'],['正式片库永不成为清理根','仅允许注册收件根内的清单文件；映射盘、别名、路径重叠与替换文件都必须重新校验。']].map(([title,desc])=>`<div class="rule"><h3>${title}</h3><p>${desc}</p></div>`).join('')}</div></section>`}
function bridge(){return heading('READ-ONLY BRIDGE / Mac 信息桥','看得到进展，不接管计算。','独立只读信息入口：状态、事件与有界日志。Mac 不加入计算设备池，不提供派单、停止或文件删除。',button(`${icon('refresh')}模拟刷新快照`,'bridge-refresh','','ghost'))+`<div class="notice ${state.bridgeFresh?'green':'amber'}">${icon(state.bridgeFresh?'check':'clock')}<div><strong>${state.bridgeFresh?'演示快照已更新':'快照已过期 · 最后收到：12 分钟前'}</strong><p>事件序号存在缺口：DEMO-104 → DEMO-108。${state.bridgeFresh?'刷新不会把历史缺口当成已补齐。':'旧数据保留并标记，不推断任务已完成。'}</p></div></div><div class="tabs" aria-label="Mac 信息桥视图">${[['status','状态'],['events','事件'],['logs','有界日志']].map(([key,label])=>`<button class="tab" data-action="bridge-tab" data-tab="${key}" aria-pressed="${state.bridgeTab===key}">${label}</button>`).join('')}</div><section class="panel"><div class="panel-head"><div><h2>Mac 信息桥 · DEMO-MAC</h2><p>只读 · 不属于计算设备清单</p></div><span class="chip ${state.bridgeFresh?'green':'amber'}">${state.bridgeFresh?'当前演示快照':'过期'}</span></div><div class="panel-body">${state.bridgeTab==='status'?`<dl class="facts"><dt>最后观测状态</dt><dd>演示同步任务运行中</dd><dt>新鲜度</dt><dd>${state.bridgeFresh?'刚刚（模拟）':'12 分钟前，当前状态未知'}</dd><dt>事件完整性</dt><dd class="amber">缺少 DEMO-105 至 DEMO-107</dd><dt>权限范围</dt><dd>状态 / 事件 / 脱敏日志只读</dd><dt>禁止操作</dt><dd>派单、终止进程、文件读写、远程删除</dd></dl>`:state.bridgeTab==='events'?`<ol class="events"><li class="event"><time>10:42:19</time><div>DEMO-108 · 观测到服务心跳<p>快照不包含缺失事件的补录。</p></div></li><li class="event"><time>缺口</time><div class="amber">DEMO-105 — DEMO-107 未收到<p>不据此推断成功、失败或静默空闲。</p></div></li><li class="event"><time>10:30:02</time><div>DEMO-104 · 演示任务开始<p>信息桥不拥有此任务的执行控制权。</p></div></li></ol>`:`<p class="small muted" style="margin-bottom:12px">仅演示最近 5 行 · 上限 200 行 / 64 KiB · 读取不足会标记截断</p><pre class="terminal">[DEMO 10:30:02] observed: task started\n[DEMO 10:30:03] source: &lt;redacted&gt;\n[DEMO 10:30:04] worker: running\n[DEMO 10:42:19] heartbeat received\n[DEMO] EVENT GAP: 105..107 / history incomplete</pre>`}</div></section>`}
function sourceTree(){return state.sourceShape==='actor'?'收件根 INBOX-01（演示）\n└─ 演员目录（虚构）\n   └─ 影片目录 F08\n      ├─ source-video.mp4\n      ├─ existing.nfo\n      └─ existing.zh.srt':state.sourceShape==='film'?'收件根 INBOX-01（演示）\n└─ 影片目录 F08\n   ├─ source-video.mp4\n   ├─ existing.nfo\n   └─ existing.zh.srt':'收件根 INBOX-01（演示）\n├─ source-video.mp4\n├─ existing.nfo\n└─ existing.zh.srt\n\n无法唯一归属的伴随文件 → 人工确认'}
function settings(){let body='';if(state.wizard===1)body=`<div class="form-grid"><div><div class="field"><label for="source-shape">收件目录结构</label><select id="source-shape"><option value="actor" ${state.sourceShape==='actor'?'selected':''}>演员 / 影片 / 文件</option><option value="film" ${state.sourceShape==='film'?'selected':''}>影片 / 文件</option><option value="flat" ${state.sourceShape==='flat'?'selected':''}>平铺文件（歧义进入待确认）</option></select></div><div class="divider"></div><h3>已经有 NFO / srt 时</h3><label class="option-card spacer-top"><input type="radio" name="existing" value="preserve" ${state.existing==='preserve'?'checked':''}><span>保留并复用有效元数据 / 字幕<p>内容校验后纳入原始输入清单；字幕语言与来源分别记录。</p></span></label><label class="option-card" style="margin-top:10px"><input type="radio" name="existing" value="review" ${state.existing==='review'?'checked':''}><span>先人工核对再复用<p>不覆盖原文件；新产物写入独立工作区。</p></span></label></div><div><div class="section-label">来源结构预览 · 虚构名称</div><pre class="tree">${sourceTree()}</pre><p class="small muted spacer-top">文件暂时不再增长不等于收件完整。托管投递自动 commit 后才固定完整清单；普通 SMB 只能标记 snapshot_only，存疑输入禁止自动清理。后续新增文件不属于已有授权。</p></div></div>`;if(state.wizard===2)body=`<div class="notice">${icon('device')}<div>主控和本机 Agent 位于同一台 Windows 机器。此处为角色预览，不会启动或迁移服务。</div></div><div class="rule-list">${devices.map(d=>`<div class="rule"><h3>${d.id} · ${d.gpu} ${d.vram}</h3><p>${d.local?'Hub 主控 + 本机 Agent':'独立计算 Agent'} · ${d.rule}</p></div>`).join('')}<div class="rule"><h3>Mac 信息桥 · 只读</h3><p>状态 / 事件 / 有界日志；不会注册为第六台计算机。</p></div></div>`;if(state.wizard===3)body=`<div class="notice amber">${icon('shield')}<div>清理白名单只包含 5 个演示收件根。NAS-A/B/C/D 的 16 个正式库根及其别名、父子重叠路径都禁止成为清理根。</div></div><dl class="facts"><dt>原始输入</dt><dd>输入机器 + INBOX-01…05 + 固定输入清单</dd><dt>工作区 / 成品</dt><dd>独立处理目录；与原始收件目录分离</dd><dt>NAS 目标</dt><dd>NAS-A/B/C/D × 各 4 个库根 = 16 个</dd><dt>入库授权</dt><dd>影片版本 + 演员 + 精确目标 + 成品包 + 来源清单</dd><dt>清理前提</dt><dd>完整入库回执 + 输入身份未变 + 单一清理持有者</dd></dl><div class="divider"></div><p class="small muted">没有唯一目标、权限不足、离线、同名冲突均阻止自动入库。手动选择后仍须重新预检与图文确认。</p>`;if(state.wizard===4)body=`<div class="notice ${state.setupSaved?'green':''}">${icon(state.setupSaved?'check':'info')}<div>${state.setupSaved?'模拟向导已完成；配置仅在当前页面内存中。':'迁移仅做预检。目标运行模式：托管后台服务 + 连接式窗口，关闭窗口不停止后台；现有伴随进程模式须显式迁移，不静默改变退出行为。'}</div></div><dl class="facts"><dt>收件结构</dt><dd>${{actor:'演员 / 影片 / 文件',film:'影片 / 文件',flat:'平铺文件；歧义转人工'}[state.sourceShape]}</dd><dt>已有 NFO / srt</dt><dd>${state.existing==='preserve'?'校验后复用，不覆盖':'先人工核对，不覆盖'}</dd><dt>设备</dt><dd>5 台，含主控本机；8 GB 节点拒绝 4K</dd><dt>路径映射</dt><dd>5 个收件根 / 16 个目标库根，必须互不重叠</dd><dt>安全迁移顺序</dt><dd>盘点 → 暂停新领取 → 等待在途任务 → 快照与回滚点 → 单主控接管 → 验证恢复</dd><dt>来源清理</dt><dd>完整回执之后，仅清理入库授权清单中身份未变的原片及伴随文件</dd></dl><div class="divider"></div><label class="check"><input id="setup-ack" type="checkbox" ${state.setupSaved?'checked':''}>我理解此处只预览规则，不会迁移服务或修改任何真实目录。</label>`;return heading('SETUP & MIGRATION / 设置与迁移','先把边界说清楚。','按现有目录结构接入，识别已有 NFO / 字幕；保留工作区与来源清理的独立身份。')+`<div class="wizard-steps">${[['收件与已有文件',1],['设备与角色',2],['库根与清理边界',3],['迁移预检',4]].map(([title,n])=>`<button class="wizard-step" data-action="wizard" data-step="${n}" ${state.wizard===n?'aria-current="step"':''}><span>${n}</span>${title}</button>`).join('')}</div><section class="panel"><div class="panel-head"><h2>${['','收件与已有文件','设备与角色','库根与清理边界','迁移预检'][state.wizard]}</h2><span class="chip">步骤 ${state.wizard} / 4</span></div><div class="panel-body">${body}<div class="wizard-foot">${button('上一步','wizard',`data-step="${state.wizard-1}" ${state.wizard===1?'disabled':''}`,'ghost')}${state.wizard<4?button('下一步 '+icon('arrow'),'wizard',`data-step="${state.wizard+1}"`,'primary'):button('保存演示规则','save-setup',state.setupSaved?'':'disabled','primary')}</div></div></section>`}
const renderers={overview,queue,review:reviewPage,exceptions,devices:devicesPage,local:localPage,libraries,bridge,settings};
function render(){const nav=navHTML();$('#navigation').innerHTML=nav;$('#mobile-navigation').innerHTML=nav;$('#breadcrumb').textContent=state.page==='overview'?'全局工作流':pages.find(p=>p[0]===state.page)[1];$('#claim-status').textContent=state.paused?'新领取已暂停':'可领取新任务';$('#claim-status').className='chip '+(state.paused?'amber':'green');$('#main').innerHTML=renderers[state.page]()+footer();document.title=`TaskPaw · ${pages.find(p=>p[0]===state.page)[1]} · 设计演示`}
function navigate(page,focus=true){if(!renderers[page])return;state.page=page;location.hash=page;render();if($('#nav-dialog').open)$('#nav-dialog').close();if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4800)}
function showDialog(title,subtitle,body,foot='',drawer=false){const d=$('#dialog');if(!d.open)lastFocus=document.activeElement;d.className='modal'+(drawer?' drawer':'');d.innerHTML=`<div class="modal-head"><div><h2 id="dialog-title" tabindex="-1">${title}</h2><p>${subtitle}</p></div><button class="btn ghost icon-btn" data-action="close" aria-label="关闭对话框">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!d.open)d.showModal();$('#dialog-title',d).focus({preventScroll:true});}
function closeDialog(){const d=$('#dialog');if(d.open)d.close();dialogState=null;}
$('#dialog').addEventListener('close',()=>{if($('#dialog').open)return;if(lastFocus&&document.contains(lastFocus))lastFocus.focus();else $('#main').focus({preventScroll:true});dialogState=null});
function detail(id){const f=film(id);dialogState={type:'detail',id};let isLtx=['encode','denoise'].includes(f.status);showDialog('影片详情',`${f.id} · 演示影片 · 全流程身份记录`,`<div class="detail-hero">${cover(f,'large')}<div><div class="eyebrow">FICTION / ORIGINAL ART</div><h2>${f.title}</h2><div class="chips">${status(f)}<span class="chip">${f.resolution}</span></div><p>${f.actor}</p><p>来源 ${f.source} · ${f.device||'主控编排'}</p></div></div>${isLtx?`<div class="detail-progress">${progress(f,true)}</div>`:`<div class="notice no-margin">${icon('info')}<div>${statusMeta[f.status][0]} · ${f.status==='completed'?'完整入库回执与来源清理结果均已记录。':f.status==='skipped'?'未继续处理，原始来源完整保留。':'只显示当前已知状态；未观测到的阶段不标记完成。'}</div></div>`}<div class="divider"></div><div class="section-label">目标与输入分离</div><dl class="facts"><dt>影片编号</dt><dd class="mono">DEMO-${f.id}</dd><dt>目标</dt><dd>${target(f)}</dd><dt>原始来源</dt><dd>${f.source} / 演示输入 ${f.id} · 清单 3 项</dd><dt>成品包</dt><dd>独立工作区 / ${f.id} · 视频 + 字幕 + NFO + 几何封面</dd><dt>清理权限</dt><dd>${f.snapshotOnly?'普通 SMB 快照，禁止自动清理':'托管投递已提交；仅清理已授权清单，身份改变即阻断'}</dd><dt>入库回执</dt><dd>${f.receipt||'尚未取得；来源不得清理'}</dd></dl><div class="divider"></div><h3>事件记录 · 演示</h3><ol class="events spacer-top"><li class="event"><time>10:10</time><div>输入清单固定<p>source-video.mp4、existing.nfo、existing.zh.srt</p></div></li><li class="event"><time>当前</time><div>${statusMeta[f.status][0]}<p>${f.receipt?'已有成品包完整回执；清理结果独立记账。':'等待对应阶段结果，不推断总体完成率。'}</p></div></li></ol><details class="spacer-top"><summary class="link-btn">查看脱敏日志片段</summary><pre class="terminal">${isLtx?`[DEMO ${f.status}] ${f.percent}% | ${f.current}/${f.total} [${f.elapsed}&lt;${f.eta}, ${f.rate}${f.unit} runETA ${f.runEta}]`:`[DEMO] film=${f.id}\n[DEMO] state=${f.status}\n[DEMO] path=&lt;logical-root-only&gt;`}</pre></details>`,`<p>演示抽屉 · 不读取文件或机器</p><div class="actions">${reviewStates.includes(f.status)?button('前往图文确认','review',`data-id="${f.id}"`,'primary'):exceptionStates.includes(f.status)?button(exceptionInfo(f)[2],'exception',`data-id="${f.id}"`,'primary'):button('关闭','close','','ghost')}</div>`,true)}
function reviewBlock(f,s){if(['offline','permission','duplicate'].includes(f.status))return {offline:'NAS-D 离线：目标不可验证。请先恢复连接并重新预检。',permission:'写入权限不足：目标不可提交。请由操作者修复权限后重新预检。',duplicate:'目标已有同名包且内容不同：禁止覆盖。请核对冲突或选择其他合规目标。'}[f.status];if(!s.root||!s.actor)return f.status==='multi'?'有多个候选：请明确选择演员与目标目录。':'没有可靠匹配：必须人工指定演员与目标，或接管处理。';return ''}
function review(id,keep=false){const f=film(id);if(!keep||dialogState?.id!==id||dialogState?.type!=='review')dialogState={type:'review',id,root:f.root,actor:f.status==='nomatch'?'':f.actor,ack:false,manual:false};const s=dialogState,blocked=reviewBlock(f,s);let choices=f.status==='multi'?`<h3>选择明确的演员与目标</h3><p class="small muted">别名命中两个候选；相似度不等于确认授权。</p><div class="candidate-list">${[['A03','演员夜航','同名别名 · NAS-A / A03'],['B02','演员夜航乙','近似名称 · NAS-B / B02']].map(([r,a,desc])=>`<button class="candidate" data-action="candidate" data-root="${r}" data-actor="${a}" aria-pressed="${s.root===r}"><strong>${a}</strong><span>${desc}</span></button>`).join('')}</div>`:'';if(f.status==='nomatch')choices=`<h3>无匹配，需要人工指定</h3><p class="small muted spacer-top">原型只列出演示演员与 16 个逻辑库根。真实产品应支持打开当前影片文件夹进行人工核对。</p><div class="form-grid spacer-top"><div class="field"><label for="manual-actor">演员（人工核对后选择）</label><select id="manual-actor"><option value="">请选择演示演员</option>${['演员新岛','演员远岸','演员山海'].map(a=>`<option ${s.actor===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="manual-root">NAS / 库根</label><select id="manual-root"><option value="">请选择目标库根</option>${['A','B','C','D'].flatMap(l=>[1,2,3,4].map(n=>{const r=`${l}0${n}`;return `<option value="${r}" ${s.root===r?'selected':''} ${(l==='D'&&!state.nasRestored)||(r==='C03'&&!state.permissionRestored)?'disabled':''}>NAS-${l} / ${r}${l==='D'&&!state.nasRestored?'（离线）':r==='C03'&&!state.permissionRestored?'（权限不足）':''}</option>`})).join('')}</select></div></div>`;
showDialog('核对影片与入库目标',f.snapshotOnly?'降级模式：仅归档快照，原始来源保持不变':'一次确认：入库通过后，自动清理下方指定来源',`<div class="confirmation-layout">${cover(f)}<div><div class="eyebrow">FILM / ${f.id} · 演示</div><h3>${f.title}</h3><div class="chips"><span class="chip">${f.resolution}</span>${status(f)}</div><p>封面与演员均为虚构演示素材</p><p>演员：<strong>${esc(s.actor||'待人工确认')}</strong></p><p class="${f.snapshotOnly?'amber':'green'}">收件完整性：${f.snapshotOnly?'普通 SMB 快照 · 完整复制未证明':'托管投递自动 commit · 整包接纳已验证'}</p></div></div>${choices}${blocked?`<div class="notice amber spacer-top">${icon('alert')}<div>${blocked}</div></div>`:''}<div class="target-box"><h3>${icon('library')} 最终入库目标</h3><dl class="facts"><dt>NAS</dt><dd>${s.root?`NAS-${s.root[0]}`:'未选择'}</dd><dt>库根 / 演员</dt><dd>${s.root||'未选择'} / ${esc(s.actor||'未确认')}</dd><dt>已有片库</dt><dd>禁止覆盖、替换或删除</dd><dt>写入前检查</dt><dd>${blocked?'未通过，不允许提交':'演示通过 · 目标不存在、连接可用、可写'}</dd></dl><div class="target-path">${s.root?`NAS-${s.root[0]} / 库根 ${s.root} / ${esc(s.actor)} / ${f.id}`:'请先选择完整目标'}</div></div><h3>将入库的成品包 · 4 个文件</h3><ul class="package-list"><li><span>video.mp4 <span class="muted">· 修复成品</span></span><span>完整内容校验</span></li><li><span>video.zh.srt <span class="muted">· 中文字幕</span></span><span>归属已核对</span></li><li><span>movie.nfo <span class="muted">· 刮削元数据</span></span><span>演员待您确认</span></li><li><span>poster.svg <span class="muted">· 演示封面</span></span><span>原创几何图</span></li></ul><div class="source-box"><h3>${icon('folder')} ${f.snapshotOnly?'原始来源将保留 · 禁止自动清理':'入库成功后，将清理的原始来源'}</h3><p>${f.source} / 输入清单 DEMO-INPUT-${f.id} · 3 项</p><ul class="package-list"><li><span>source-video.mp4</span><span>原始影片</span></li><li><span>existing.nfo</span><span>同批收件元数据</span></li><li><span>existing.zh.srt</span><span>同批收件字幕</span></li></ul><p>只清理本清单且身份未变的文件。新增文件、其他影片、父目录与 NAS 正式片库均不删除。</p></div><label class="check"><input type="checkbox" id="review-ack" ${s.ack?'checked':''} ${blocked?'disabled':''}><span>${f.snapshotOnly?'我理解普通 SMB 输入完整性未证明，同意仅归档当前成品快照并保留全部原始来源。':'我已核对这部影片、演员、完整目标、成品包及来源清单，同意在入库验证成功后清理以上来源。'}</span></label>`,`<p>${blocked?'请先解决阻断原因；来源保持不变。':'确认后模拟完整校验与来源清理，不执行真实操作。'}</p><div class="actions">${button('人工接管','handoff',`data-id="${id}"`,'ghost')}${button(f.snapshotOnly?'确认归档快照并保留来源':'确认入库并清理来源','approve',`data-id="${id}" ${blocked||!s.ack?'disabled':''}`,'primary')}</div>`)}
function approval(id){const f=film(id),s=dialogState;if(!s||s.type!=='review'||reviewBlock(f,s)||!s.ack)return;f.root=s.root;f.actor=s.actor;f.receipt=`DEMO-RCPT-${id}`;if(f.snapshotOnly){f.status='cleanup';f.cleaned=false;render();dialogState={type:'snapshot-receipt',id};showDialog('快照已归档，原始来源保留','收件完整性未证明，禁止自动清理',`<div class="receipt"><h3>${f.title} · 成品快照已归档</h3><p>${target(f)} · ${f.receipt}</p></div><div class="notice amber">${icon('shield')}<div>普通 SMB 只能证明当前快照自洽，不能证明原片完整。原始来源 3 项全部保留；任务停在已入库待核对，不能点击清理重试绕过。</div></div>`,`<p>后续需有效完整性证明与新的明确授权。</p><div class="actions">${button('关闭','close','','primary')}</div>`);return}f.status='completed';f.cleaned=true;render();dialogState={type:'receipt',id};showDialog('模拟入库与来源清理完成','这次操作只更新演示数据，没有连接 NAS 或删除文件',`<div class="receipt"><h3>${icon('check')} ${f.title} · 已完成</h3><p>${target(f)}</p></div><ol class="events"><li class="event"><time>01</time><div>成品包 4 / 4 完整校验，目标不覆盖提交<p>虚构回执：${f.receipt}</p></div></li><li class="event"><time>02</time><div>原始输入身份复核通过<p>DEMO-INPUT-${f.id} · 3 个文件，清单固定且未变化。</p></div></li><li class="event"><time>03</time><div>来源清理完成（模拟）<p>仅清理已授权的 3 个收件文件；正式片库与其他文件未动。</p></div></li></ol><div class="notice green spacer-top">${icon('shield')}<div>如果来源身份变化、被占用或断联，真实流程会停在“已入库 · 待清理”，只重试清理，不重复上传。</div></div>`,`<p>回执与清理记录在影片详情中分别保留。</p><div class="actions">${button('查看影片记录','detail',`data-id="${id}"`,'ghost')}${button('继续核对下一部','next-review','','primary')}</div>`);toast('模拟完成：成品已入库，清单内来源已清理。')}
function exceptionAction(id){const f=film(id);if(f.status==='unknown'){dialogState={type:'reconcile',id};showDialog('先核对入库结果','结果未知期间：禁止重复上传，禁止来源清理',`<div class="notice amber">${icon('alert')}<div>${f.title} 的目标提交后连接中断。目前无法确定是否已有完整成品。</div></div><dl class="facts"><dt>目标</dt><dd>${target(f)}</dd><dt>本地记录</dt><dd>提交意图存在，最终回执未收到</dd><dt>必须核对</dt><dd>目标影片包、文件身份、完整校验与入库事务一致</dd><dt>不允许</dt><dd>盲目重传、覆盖同名包、先删来源</dd></dl><div class="divider"></div><h3>选择一种演示核对结果</h3><p class="small muted spacer-top">这两个按钮仅用于预览成功核对与仍不确定的分支。</p>`,`<p>真实产品须由核对结果驱动状态，不能由按钮伪造成功。</p><div class="actions">${button('模拟：仍无法确定','reconcile-hold',`data-id="${id}"`,'ghost')}${button('模拟：完整回执已验证','reconcile-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='cleanup'&&(f.cleanupChanged||f.snapshotOnly)){handoff(id);toast('输入身份或完整性未通过，禁止清理；需人工核对。');}else if(f.status==='cleanup'){dialogState={type:'cleanup',id};showDialog('仅重试来源清理','不重新修复、不重新刮削、不重复上传',`<div class="receipt"><h3>成品包已验证入库</h3><p>回执 ${f.receipt} · ${target(f)}</p></div><dl class="facts"><dt>允许清理</dt><dd>${f.source} / DEMO-INPUT-${id} 内 3 个原始文件</dd><dt>上次失败</dt><dd>源文件被占用（演示）</dd><dt>重试检查</dt><dd>当前回执、收件根授权、输入身份与内容、唯一清理持有者</dd><dt>若文件变了</dt><dd>立即保留来源并转人工核对</dd></dl><div class="notice amber spacer-top">${icon('shield')}<div>不会遍历删除收件目录，也不会把 NAS 正式片库当作清理根。</div></div>`,`<p>模拟重试前会重新核对身份。</p><div class="actions">${button('模拟：输入已变化','cleanup-changed',`data-id="${id}"`,'ghost')}${button('模拟身份一致并重试','cleanup-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='duplicate'){review(id)}else if(['offline','permission'].includes(f.status)){dialogState={type:'retry',id};showDialog('恢复后重新预检','连接与权限恢复后仍须重新核对目标',`<div class="notice amber">${icon('alert')}<div>${f.title} · ${statusMeta[f.status][0]}。此演示不会访问任何 NAS。</div></div><p>模拟恢复只把影片送回“待确认”。原片保留，不自动上传，也不沿用过期的确认授权。</p>`,`<p>下一步仍是按影片图文确认。</p><div class="actions">${button('取消','close','','ghost')}${button('模拟恢复并返回待确认','retry-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='stopped'){f.status='inbox';f.device=null;state.localDemo=null;render();closeDialog();toast('影片已回到待领取队列；来源保留。')}}
function more(id){const f=film(id);dialogState={type:'more',id};showDialog('异常处理选项',`${f.title} · ${f.id}`,`<div class="notice">${icon('info')}<div>跳过仅停止本流程继续处理，保留来源。人工接管保留任务记录与文件身份；不会授予 NAS 删除或覆盖权限。</div></div>${f.status==='unknown'?'<p class="amber small">入库结果未知仍需核对。跳过不会把未知结果标为成功，也不会清理来源。</p>':''}`,`<p>所有操作仅为演示状态变更。</p><div class="actions">${button('查看影片','detail',`data-id="${id}"`,'ghost')}${button('人工接管','handoff',`data-id="${id}"`,'ghost')}${button('跳过并保留来源','skip',`data-id="${id}"`,'danger')}</div>`)}
function handoff(id){const f=film(id);dialogState={type:'handoff',id};showDialog('人工接管这部影片',`${f.title} · 来源始终保留`,`<div class="confirmation-layout">${cover(f)}<div><h3>${f.title}</h3><p>输入位置：${f.source} / 演示输入 ${id}</p><p>成品位置：工作区 / 演示成品 ${id}</p><p>真实产品应打开当前影片的注册文件夹，并保留原输入与目标身份。此原型只展示交接卡。</p></div></div><div class="notice amber">${icon('shield')}<div>手工处理后重新扫描核对。不能仅凭“我已处理”生成入库回执或自动删除来源。</div></div>`,`<p>当前没有文件夹或真实路径可打开。</p><div class="actions">${button('模拟打开文件夹说明','folder-info',`data-id="${id}"`,'ghost')}${button('标记人工接管，保留来源','handoff-ok',`data-id="${id}"`,'primary')}</div>`)}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){event.preventDefault();navigate(nav.dataset.nav);return}const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,id=btn.dataset.id;switch(a){case'nav':navigate(btn.dataset.page);break;case'menu':$('#nav-dialog').showModal();break;case'close-nav':$('#nav-dialog').close();break;case'close':closeDialog();break;case'reset':closeDialog();state=initial();navigate('overview');toast('已重置全部虚构影片与演示规则。');break;case'pause':state.paused=!state.paused;render();toast(state.paused?'已暂停新的领取；所有在途任务继续。':'已恢复新任务领取。');break;case'flow':state.stage=btn.dataset.filter;navigate('queue');break;case'detail':detail(id);break;case'review':review(id);break;case'review-filter':state.reviewFilter=btn.dataset.filter;render();break;case'exception-filter':state.exceptionFilter=btn.dataset.filter;render();break;case'candidate':dialogState.root=btn.dataset.root;dialogState.actor=btn.dataset.actor;dialogState.ack=false;review(dialogState.id,true);break;case'approve':approval(id);break;case'next-review':{const next=state.films.find(f=>f.status==='ready');if(next)review(next.id);else{closeDialog();navigate('review')}break}case'exception':exceptionAction(id);break;case'exception-more':more(id);break;case'retry-ok':if(film(id).status==='offline')state.nasRestored=true;if(film(id).status==='permission')state.permissionRestored=true;film(id).status='ready';render();review(id);toast('模拟预检通过；仍需重新确认入库。');break;case'reconcile-hold':closeDialog();toast('仍为入库结果未知：不重传、不清理来源。');break;case'reconcile-ok':film(id).status='cleanup';film(id).receipt=`DEMO-RCPT-${id}`;render();exceptionAction(id);toast('模拟已核对完整回执。接下来只处理来源清理。');break;case'cleanup-ok':if(film(id).cleanupChanged||film(id).snapshotOnly){toast('输入身份或完整性未通过，禁止清理。');break}film(id).status='completed';film(id).cleaned=true;render();closeDialog();toast('仅重试来源清理成功（模拟）；未重复上传。');break;case'cleanup-changed':film(id).cleanupChanged=true;closeDialog();render();showDialog('来源身份变化：已阻止清理','原始文件可能被替换；成品仍保持已入库状态',`<div class="notice red">${icon('shield')}<div>DEMO-INPUT-${id} 的当前文件身份与入库授权不一致。来源完整保留，需要人工核对。</div></div><p class="small muted">重新授权前不得清理，也不需要重复上传已入库的成品。</p>`,`<p>演示已阻止本次清理。</p><div class="actions">${button('人工接管','handoff',`data-id="${id}"`,'primary')}</div>`);break;case'skip':{const f=film(id);f.previousStatus=f.status;if(f.status==='unknown'||f.status==='cleanup'){f.autoPaused=true}else{f.status='skipped'};f.keepSource=true;closeDialog();render();toast('已跳过并保留来源；既有目标与未知入库记录未改动。');break}case'handoff':handoff(id);break;case'handoff-ok':{const f=film(id);f.manual=true;closeDialog();render();toast('已标记人工接管，保留来源；原状态与核对义务保留。');break}case'folder-info':toast('演示交接位置：'+film(id).source+' / '+id+'。未打开真实文件夹。');break;case'bridge-tab':state.bridgeTab=btn.dataset.tab;render();break;case'bridge-refresh':state.bridgeFresh=true;render();toast('模拟快照已刷新；历史事件缺口仍保留。');break;case'wizard':state.wizard=Number(btn.dataset.step);render();break;case'save-setup':if($('#setup-ack')?.checked){state.setupSaved=true;render();toast('演示规则已保存在本页内存；未修改配置或迁移服务。')}break;case'actor-index':showDialog('演示演员索引',`NAS-${btn.dataset.nas} · 虚构目录与别名`,`<dl class="facts"><dt>演员星河</dt><dd>别名：星河甲 / 星河（演示）</dd><dt>演员夜航</dt><dd>同名候选存在于 NAS-A / A03 与 NAS-B / B02</dd><dt>匹配结果</dt><dd>仅提供候选。多候选与无匹配必须人工选择。</dd><dt>索引边界</dt><dd>只读正式库根中的目录信息；不自动合并、重命名或删除已有演员目录。</dd></dl>`,`<p>真实姓名、头像与实际索引均未读取。</p><div class="actions">${button('关闭','close','','ghost')}</div>`);break;case'local-drain':state.localDraining=!state.localDraining;render();toast(state.localDraining?'本机排空：在途任务继续，新的领取暂停；其余设备不变。':'已取消本机排空。');break;case'local-demo':{const f=film('F07');if(!state.localPaused&&!state.localDraining){f.status='denoise';f.device='GPU-05';Object.assign(f,{percent:18,current:'22',total:'120',rate:'2.86',unit:'s/step',elapsed:'01:03',eta:'04:40',runEta:'07:20'});state.localDemo=f.id;render();toast('已载入本机 1080p 演示任务；其他设备不变。')}break}case'local-control':if(state.localPaused){state.localPaused=false;render();toast('本机恢复领取，已停止影片仍在队列中等待重新安排。')}else showDialog('仅停止本机任务','作用范围：GPU-05 / RTX 5060 8 GB',`<div class="notice amber">${icon('stop')}<div>停止本机在途任务并暂停本机新领取。保留来源与阶段结果；Hub 主控以及其他四台设备继续运行。</div></div><p class="small muted">${state.localDemo?'当前本机演示任务：'+film(state.localDemo).title:'本机当前空闲；确认后仅暂停本机领取。'}</p>`,`<p>此操作不暂停全局队列，不停止其他机器。</p><div class="actions">${button('取消','close','','ghost')}${button('确认仅停止本机','local-stop','','danger')}</div>`);break;case'local-stop':state.localPaused=true;if(state.localDemo)film(state.localDemo).status='stopped';render();closeDialog();toast('仅本机已停止；其他设备与 Hub 继续运行。');break}});
document.addEventListener('change',event=>{const el=event.target;switch(el.id){case'stage-filter':state.stage=el.value;render();break;case'resolution-filter':state.resolution=el.value;render();break;case'review-ack':dialogState.ack=el.checked;{const approve=$('[data-action="approve"]');approve.disabled=!el.checked||!!reviewBlock(film(dialogState.id),dialogState)}break;case'manual-actor':case'manual-root':{const focused=el.id;dialogState[el.id==='manual-actor'?'actor':'root']=el.value;dialogState.ack=false;review(dialogState.id,true);$('#'+focused)?.focus();break}case'source-shape':state.sourceShape=el.value;state.setupSaved=false;render();$('#source-shape').focus();break;case'setup-ack':$('[data-action="save-setup"]').disabled=!el.checked;break}if(el.name==='existing'){state.existing=el.value;state.setupSaved=false;}});
document.addEventListener('input',event=>{if(event.target.id==='film-search'){const start=event.target.selectionStart;state.search=event.target.value;render();const input=$('#film-search');input.focus();try{input.setSelectionRange(start,start)}catch{/* search input selection is browser dependent */}}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(renderers[page]&&state.page!==page)navigate(page,false)});
$('#brand').innerHTML=paw+'<div>TaskPaw<small>MEDIA WORKSPACE</small></div>';
$('[data-action="menu"]').innerHTML=icon('menu');$('[data-action="close-nav"]').innerHTML=icon('close');
const initialPage=location.hash.slice(1);if(renderers[initialPage])state.page=initialPage;render();
</script>
