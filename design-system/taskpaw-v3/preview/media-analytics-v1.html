<title>媒体数据分析</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the 媒体处理中心 shell (scope banner, 205px rail, content) inside a thin demo bar.
   Single dark theme on purpose: TaskPaw V3 is dark-only; shell values copied from mediaStyles.ts.
   Charts are hand-rolled inline SVG (no library); every color is a token below. */
:root{
  --page:#070C17;--bg:#0B1120;--surface:#111A2E;--low:#0D1626;--line:#263650;--text:#F8FAFC;--muted:#A8B5C7;--soft:#C9D6E7;
  --green:#22C55E;--green-light:#97E8B4;--blue:#75D2FA;--amber:#FBC76A;--red:#FDA4AF;--on-green:#06210F;
  --demo:#C4B5FD;--demo-bg:#8B5CF614;--demo-line:#8B5CF640;
  /* chart palette, validated on #111A2E - fixed order, never cycled */
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#9085e9;
  --c-queue:#5b6b82;--c-total:#8b9bb3;--c-prev:#6b7d96;--c-spark:#5f7190;
  --st-green:#22C55E;--st-amber:#FBC76A;--st-red:#FDA4AF;--lane-on:#22c55e8c;
  --grid:#1f2d45;--axis:#33465f;--uncov:#ffffff09;--tt-bg:#0A1222;--track:#1b2a40;--meter-track:#1d3352;
  --sans:"Fira Sans",system-ui,"Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"Fira Code",Consolas,"Microsoft YaHei",monospace;
  color-scheme:dark;
}
body{background:var(--page);color:var(--text);font:14px/1.6 var(--sans);margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
h2{font-size:17px;font-weight:600}h3{font-size:13px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.icon{width:19px;height:19px;flex:none;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* demo bar (not part of the product) */
.demo-bar{max-width:1600px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px dashed var(--demo-line);border-radius:10px;background:var(--demo-bg);color:var(--demo);font-size:12px}
.demo-bar strong{font-weight:600;letter-spacing:.3px}
.demo-bar .seg{background:transparent;border-color:var(--demo-line)}
.demo-bar .seg-opt{min-height:34px;color:#cbbff5}
.demo-bar .seg-opt[aria-checked=true]{background:#8b5cf622;border-color:#8b5cf677;color:#ece6ff}
.dot{width:7px;height:7px;border-radius:50%;background:var(--demo);display:inline-block;flex:none}

/* shell */
.mw-root{max-width:1600px;margin:0 auto;position:relative;background:radial-gradient(1000px 650px at 80% -200px,#38bdf80b,transparent),var(--bg);border:1px solid var(--line);border-radius:12px;overflow:clip}
.scope-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 25px;background:#22c55e06;border-bottom:1px solid #223c33;font-size:11px;color:#b5cdbf;flex-wrap:wrap}
.health{display:flex;gap:6px;flex-wrap:wrap}
.workspace-shell{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:760px}
.workspace-rail{padding:22px 13px;background:#0e1727;border-right:1px solid var(--line)}
.workspace-heading{padding:0 13px 18px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.workspace-heading strong{display:block;font-size:14px}
.nav-group{display:flex;flex-direction:column;gap:5px}
.nav-item{min-height:46px;display:flex;align-items:center;gap:12px;color:var(--muted);padding:10px 13px;border:1px solid transparent;border-radius:8px;font-size:13px;background:transparent;text-align:left;width:100%;transition:background .16s,color .16s;position:relative}
.nav-item:hover{background:#ffffff05;color:var(--text)}
.nav-item[aria-current=page]{background:#22c55e10;border-color:#22c55e36;color:#9be7b5}
.nav-count{margin-left:auto;min-width:22px;text-align:center;background:#263650;border-radius:5px;font:11px/20px var(--mono);color:#cedbea;padding:0 4px}
.nav-item .dot{position:absolute;left:4px;top:50%;margin-top:-3.5px}
.content{padding:27px;width:100%;min-width:0}
.mobile-nav{display:none}

.page-title{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.page-title h1{font-size:20px;line-height:1.4;font-weight:600}
.page-title-main{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.page-sub{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:9px 14px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid #344861;border-radius:8px;background:#17243a;color:#e1eaf5;font-size:12px;font-weight:500;line-height:1.5;transition:background .16s,border-color .16s;white-space:nowrap}
.btn:hover{background:#20324b;border-color:#4c6584}
.btn.small{font-size:11px;padding:6px 10px;min-height:36px}
.link-btn{min-height:32px;padding:4px 2px;border:0;background:none;display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:12px;transition:color .16s}
.link-btn:hover{color:#a8e4fc}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid #344861;border-radius:5px;background:#1b2940;color:#c8d7e9;font-size:11px;line-height:1.6;white-space:nowrap;font-weight:400}
.chip.green{background:#22c55e0e;border-color:#22c55e42;color:var(--green-light)}
.chip.blue{background:#38bdf80c;border-color:#38bdf83d;color:var(--blue)}
.chip.amber{background:#f59e0b0d;border-color:#f59e0b42;color:var(--amber)}
.chip.red{background:#fb71850d;border-color:#fb718548;color:var(--red)}
.chip .icon{width:12px;height:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.panel{border:1px solid var(--line);border-radius:12px;background:linear-gradient(170deg,var(--surface),var(--low));min-width:0;overflow:hidden}
.panel-head{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-head p{font-size:11px;color:var(--muted);margin-top:3px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-body{padding:20px}
.notice{padding:12px 15px;border:1px solid #3d536d;background:#1a2b414d;border-radius:8px;color:#c0d4e9;font-size:12px;display:flex;gap:10px;align-items:flex-start}
.notice .icon{margin-top:1px;width:17px;height:17px}
.notice.amber{color:#f9d492;border-color:#6a5229;background:#60451c20}
.notice.red{color:#fec0c9;border-color:#6e3544;background:#59233120}
.untouched{padding:40px 24px;text-align:center;color:var(--muted);border:1px dashed #33455d;border-radius:12px;display:flex;flex-direction:column;gap:6px;align-items:center}

select{background:#0d1728;border:1px solid #3b4d66;border-radius:8px;min-height:40px;color:#e0e9f5;padding:7px 12px;max-width:100%;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;border:1px solid #33455d;border-radius:9px;background:#0d1728}
.seg-opt{flex:1 1 auto;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;line-height:1.4;transition:background .16s,color .16s;white-space:nowrap}
.seg-opt:hover{background:#ffffff08;color:var(--text)}
.seg-opt[aria-checked=true]{border-color:#48805d;background:#22c55e14;color:#a0e8b9;font-weight:500}
.seg-opt .icon{width:14px;height:14px}
.vt .seg-opt{min-height:34px;padding:4px 10px;font-size:11px}
.toggle{position:relative;width:44px;height:26px;flex:none;border-radius:13px;border:1px solid #3b4d66;background:#0d1728;transition:background .16s,border-color .16s;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8fa2b9;transition:transform .16s,background .16s}
.toggle[aria-checked=true]{background:#22c55e30;border-color:#3c8a59}
.toggle[aria-checked=true]::after{transform:translateX(18px);background:var(--green-light)}

/* filter row: one row above everything it scopes */
.filterbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#0e1727f0;margin-bottom:16px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(6px)}
.fgroup{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.fgroup .seg-opt{min-height:36px;padding:4px 11px}
.switch-l{display:inline-flex;gap:10px;align-items:center;font-size:12px;color:var(--soft)}
.refresh-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}

/* KPI tiles */
#sections{display:flex;flex-direction:column;gap:18px;transition:opacity .18s ease}
#sections.busy{opacity:.45}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kv{display:block;font:600 28px/1.3 var(--sans);letter-spacing:-.3px;color:var(--text)}
.kv em{font:400 12px var(--sans);color:var(--muted);margin-left:5px;font-style:normal;letter-spacing:0}
.kpi .note{font-size:11px;color:var(--muted)}
.delta{display:flex;align-items:center;gap:4px;font-size:11px;flex-wrap:wrap}
.delta .icon{width:13px;height:13px}
.delta.good{color:var(--green-light)}.delta.bad{color:var(--red)}.delta.flat{color:var(--muted)}
.delta .vs{color:var(--muted)}
.chip.tag{padding:0 6px;font-size:10px;line-height:1.7}
.spark-box{margin-top:6px}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.chart-svg text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart-svg .tick{font-variant-numeric:tabular-nums}
.chart-svg .grid{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart-svg .axis{stroke:var(--axis);stroke-width:1;shape-rendering:crispEdges}
.chart-svg .hit{fill:transparent;stroke:none;transition:fill .15s}
.chart-svg [data-rove]{cursor:pointer;outline:none}
.chart-svg [data-rove]:hover .hit{fill:#ffffff07}
.chart-svg [data-rove]:focus-visible .hit{stroke:var(--blue);stroke-width:2}
.chart-svg .mk{transition:filter .15s}
.chart-svg [data-rove]:hover .mk,.chart-svg [data-rove]:focus-visible .mk{filter:brightness(1.25)}
.chart-svg .dlabel{fill:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.chart-svg .rlabel{fill:var(--soft);font-size:12px}
.chart-svg .vt1{fill:var(--text);font-size:11px}
.chart-svg .vt2{fill:var(--muted);font-size:10.5px}
.chart-svg .uncov{fill:var(--uncov)}
.chart-svg .uncov-t{fill:#8496ae}
.chart-svg .prev-line{fill:none;stroke:var(--c-prev);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.chart-svg .spark-line{fill:none;stroke:var(--c-spark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .spark-hit{fill:transparent;cursor:default}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--soft);margin-bottom:10px;align-items:center}
.lgd-i{display:inline-flex;align-items:center;gap:7px}
.lgd-k{display:inline-block;flex:none}
.lgd-k.rect{width:10px;height:10px;border-radius:2px}
.lgd-k.line{width:14px;height:2px;border-radius:1px}
.lgd-k.tickmk{width:2px;height:12px;background:var(--text)!important}
.lgd-i .icon{width:14px;height:14px}
.tt{position:fixed;z-index:50;pointer-events:none;background:var(--tt-bg);border:1px solid #3b506c;border-radius:8px;padding:8px 11px;font-size:12px;box-shadow:0 10px 30px #000a;min-width:130px;max-width:280px;left:0;top:0}
.tt[hidden]{display:none}
.tt-title{color:var(--muted);font-size:11px;margin-bottom:4px}
.tt-row{display:flex;align-items:center;gap:8px;line-height:1.75}
.tt-row b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tt-row span:last-child{color:var(--soft)}
.tt-key{width:12px;height:2px;border-radius:1px;flex:none}
.tt-key.none{background:transparent}
.tt-note{color:var(--muted);font-size:11px;margin-top:4px;border-top:1px solid #26365099;padding-top:4px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px}
.egrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:22px 28px}
.block{min-width:0}
.block>h3{margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.block>h3 .icon{width:15px;height:15px}
.bdesc{font-size:11px;color:var(--muted);margin-bottom:10px}
.divider{border-top:1px solid var(--line);margin:22px 0}
.multiples{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mini{border:1px solid #22324a;border-radius:9px;padding:10px 12px 6px;background:#0c1626;min-width:0}
.mini-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;margin-bottom:4px}
.mini-h strong{font-weight:600}
.ministats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mstat{border:1px solid #22324a;border-radius:9px;padding:12px 14px;background:#0c1626;min-width:0}
.mstat .label{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mstat strong{display:block;font:600 22px/1.35 var(--sans)}
.mstat strong em{font:400 12px var(--sans);color:var(--muted);margin-left:4px;font-style:normal}
.mstat .note{font-size:11px;color:var(--muted)}
.mstat .chips{margin-top:6px}
.estats{display:grid;grid-template-columns:1fr;gap:10px;align-content:start}
.summary-line{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--soft);flex-wrap:wrap;margin-bottom:8px}
.summary-line .icon{width:15px;height:15px}
.share-lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 18px;margin-top:12px;font-size:12px;color:var(--soft)}
.share-lg .lgd-i b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.share-lg .lgd-i span.m{color:var(--muted)}

/* INBOX meter */
.inbox{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px 20px;align-items:start;padding:14px 16px;border:1px solid #22324a;border-radius:10px;background:#0c1626}
.inbox h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meter{height:10px;border-radius:5px;background:var(--meter-track);overflow:hidden;margin:10px 0 6px;display:flex}
.meter span{display:block;height:100%;border-radius:0 5px 5px 0}
.inbox .fig{font:600 18px/1.4 var(--sans)}
.inbox .fig em{font:400 11px var(--sans);color:var(--muted);font-style:normal;margin-left:4px}
.inbox .sub{font-size:11px;color:var(--muted)}
.inbox .hint{grid-column:1/-1;font-size:12px;color:var(--soft);display:flex;gap:8px;align-items:center;border-top:1px solid #22324a;padding-top:10px}
.inbox .hint .icon{width:15px;height:15px;color:var(--blue)}

/* tables */
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}
table.grid.fit{min-width:0}
table.grid th{font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.3px;white-space:nowrap}
table.grid td{padding:10px 12px;border-bottom:1px solid #26365080;vertical-align:middle}
table.grid th.num,table.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid tbody tr{transition:background .14s}
table.grid tbody tr.pick{cursor:pointer}
table.grid tbody tr.pick:hover{background:#ffffff05}
table.grid tbody tr:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
table.grid tr:last-child td{border-bottom:0}
table.grid tr.sel td{background:#22c55e0a}
table.grid tr.hl td{background:#fb71850b}
table.grid tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--st-red)}
table.grid tr.grp th{background:#0c1626;color:var(--soft);font-size:11px;padding:8px 12px;border-bottom:1px solid var(--line)}
table.grid tr.grp th span{color:var(--muted);font-weight:400;margin-left:8px}
.th-btn{background:none;border:0;color:inherit;font:inherit;display:inline-flex;align-items:center;gap:4px;padding:2px 0;min-height:30px;letter-spacing:inherit;transition:color .15s}
.th-btn:hover{color:var(--text)}
.th-btn .icon{width:12px;height:12px;opacity:.5}
th[aria-sort] .th-btn{color:var(--text)}
th[aria-sort] .th-btn .icon{opacity:1}
.mname strong{display:block;font-weight:600}
.mname span{font-size:11px;color:var(--muted)}
.sbar-cell{display:flex;align-items:center;gap:8px;min-width:190px}
.sbar-track{position:relative;flex:1;height:14px;display:flex;align-items:center}
.sbar{display:flex;gap:2px;height:12px}
.sbar span{display:block;height:100%;min-width:2px;transition:filter .15s}
.sbar span:hover{filter:brightness(1.25)}
.sbar span:last-child{border-radius:0 4px 4px 0}
.avg-mk{position:absolute;top:-2px;width:2px;height:18px;margin-left:-1px;background:var(--text);border-radius:1px;opacity:.85}
.sbar-cell b{font-weight:600;font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.state-note{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap}

@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.inbox{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1080px){.workspace-shell{grid-template-columns:180px minmax(0,1fr)}.grid2,.egrid{grid-template-columns:1fr}.ministats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.workspace-shell{display:block}.workspace-rail{display:none}.mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:#0e1727}.mobile-nav .nav-item{width:auto;min-height:40px;white-space:nowrap;padding:8px 12px}.mobile-nav .nav-item .dot{left:2px}.content{padding:22px}.filterbar{position:static}}
@media(max-width:640px){.scope-banner{padding:9px 14px}.content{padding:18px 14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px 12px 8px}.kv{font-size:24px}.panel-head{padding:14px 16px}.panel-body{padding:16px 14px}.ministats{gap:10px}.inbox{grid-template-columns:1fr}.filterbar{gap:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="demo-bar" role="region" aria-label="演示说明">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><strong>UI 预览 · 虚构数据</strong><span>影片编号、演员和所有数字均为虚构；筛选和场景会真实重新计算。</span><span style="display:inline-flex;align-items:center;gap:6px"><span class="dot"></span>新增页面</span></div>
  <div class="seg" role="radiogroup" aria-label="演示场景" id="scenario-seg"></div>
</div>

<div class="mw-root" id="app"></div>
<div class="tt" id="tt" role="tooltip" hidden></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script>
(function(){
'use strict';

const MIN=6e4,H=36e5,DAY=864e5;
const NOW=Date.UTC(2026,9,31,15,0,0),TODAY=Date.UTC(2026,9,31);
const GEN_START=Date.UTC(2026,6,28),DATA_START=Date.UTC(2026,7,2),COVER=Date.UTC(2026,9,24);
const BUSH_OFF=Date.UTC(2026,9,31,8,6),SPIKE_START=Date.UTC(2026,9,31,10,12),SPIKE_STOP=Date.UTC(2026,9,31,13,41),NEW_JOIN=Date.UTC(2026,9,31,14,20);
const pad=n=>String(n).padStart(2,'0');
const dt=t=>new Date(t);
const fMD=t=>pad(dt(t).getUTCMonth()+1)+'-'+pad(dt(t).getUTCDate());
const fHM=t=>pad(dt(t).getUTCHours())+':'+pad(dt(t).getUTCMinutes());
const fMDHM=t=>fMD(t)+' '+fHM(t);
const fWk=t=>'周'+'日一二三四五六'[dt(t).getUTCDay()];
const fYM=t=>dt(t).getUTCFullYear()+'-'+pad(dt(t).getUTCMonth()+1);

const amin=a=>a.length?Math.min(...a):null;
const amax=a=>a.length?Math.max(...a):null;
const quant=(a,q)=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
const n1=v=>v==null||!isFinite(v)?'—':(Math.round(v*10)/10).toFixed(1);

/* ===================== seeded PRNG ===================== */
function mulberry32(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rng(...k){let h=2166136261;for(const x of k){h=Math.imul(h^(x|0),16777619)>>>0;h=Math.imul(h^(h>>>13),0x5bd1e995)>>>0}return mulberry32(h)}

/* ===================== data generation (deterministic per scenario) ===================== */
function gen(sc){
 const bushOff=sc!=='normal',spike=sc==='spike',fleet=fleetOf(sc);
 const films=[],events=[],iv={};fleet.concat(CTRL).forEach(m=>iv[m.id]=[]);
 const hist=BASE_GPUS; // machines with history (Newpig joined today)
 const pickM=(r,ex)=>{const pool=hist.filter(m=>!ex.includes(m.id)),tot=sum(pool.map(m=>1/m.avg));let x=r()*tot;for(const m of pool){x-=1/m.avg;if(x<=0)return m}return pool[pool.length-1]};
 const aTot=sum(ACTORS.map(a=>a[1]));
 const pickA=r=>{let x=r()*aTot;for(const a of ACTORS){x-=a[1];if(x<=0)return a[0]}return ACTORS[0][0]};
 let i=0;
 for(let day=GEN_START,di=0;day<NOW+4*DAY;day+=DAY,di++){
  const rd=rng(11,di),wd=dt(day).getUTCDay();
  const n=10+Math.floor(rd()*10)+(wd===0||wd===6?2:0)+(rd()<.5?1:0);
  for(let j=0;j<n;j++,i++){
   const r=rng(23,di,j),rr=rng(29,di,j);
   const res=r()<.46?'4K':'1080P';
   const durH=1.5+2.5*Math.pow(r(),1.35);
   const tDone=day+(.012+.975*r())*DAY;
   const noise=Math.exp((r()+r()+r()-1.5)*.42),tail=r()<.012?1.9:1;
   const speech=r()>.04;
   const asrMin=7*(durH/2.6)*(.8+.45*r());
   const transSec=speech?55*(.7+.6*r()):0;
   const lines=speech?Math.round(durH*60*(9+5*r())):0;
   const scrapeMin=3*(.55+.9*r())+(r()<.05?5*r():0);
   const sizeGB=clamp(durH*(res==='4K'?6.9:3.3)*(.65+.7*r()),2.3,42.3);
   const archiveMin=clamp(3*(sizeGB/12.6)*(.8+.4*r()),.6,12);
   const handH=.4+2.2*r();
   let queueH=clamp(14.5*Math.pow(-Math.log(1-r()*.995),.85),.3,38);
   if(tDone>NOW-8*H&&r()<.75)queueH=Math.min(tDone>NOW?62:38,queueH+16+(tDone>NOW?30:16)*r()); // the 10-30 batch drop is still queued
   const postH=(asrMin+transSec/60+scrapeMin+archiveMin)/60;
   const restoreEnd=tDone-(postH+handH*.5)*H;
   let m=pickM(r,[]),moved=null;
   if(bushOff&&m.id==='bush'&&restoreEnd>BUSH_OFF){moved='bush';m=pickM(rr,['bush'])}
   if(spike&&m.id==='gor'&&restoreEnd>SPIKE_START){moved=moved||'gor';m=pickM(rr,['gor','bush'])}
   const restoreH=clamp(m.avg/1.368*(res==='4K'?1.8:1)*(durH/2.6)*noise*tail,1.1,39);
   const restoreStart=restoreEnd-restoreH*H;
   queueH=Math.max(queueH,4.6-(handH+restoreH+postH));
   const tIn=restoreStart-(queueH+handH*.5)*H;
   const kwhR=restoreH*m.w*(.86+.12*r())/1000;
   const kwhC=(asrMin*150+(scrapeMin+archiveMin)*60)/60/1000;
   const target=r()<.74?'main':'cat',second=target==='main'&&r()<.12;
   const actor=target==='main'?pickA(r):null,unc=r()<.38;
   const code=PFX[(i*7+3)%PFX.length]+'-'+(100+(i*389)%900);
   const f={i,code,res,durH,sizeGB,m:m.id,moved,queueH,restoreH,restoreStart,restoreEnd,asrMin,transSec,lines,scrapeMin,archiveMin,tIn,tDone,leadH:(tDone-tIn)/H,kwhR,kwhC,kwh:kwhR+kwhC,target,second,actor,unc,subs:lines>0,done:tDone<=NOW};
   films.push(f);
   if(r()<.03){ // one failed attempt before the successful one
    const tr=r(),type=tr<.36?'4551':tr<.72?'ltx':tr<.86?'ffprobe':'whitelist';let ev;
    if(type==='4551'){const t=restoreStart-(.3+3.5*r())*H,fm=pickM(rr,[m.id].concat(bushOff&&t>BUSH_OFF-6*H?['bush']:[]));ev={t,type,mid:fm.id,result:'已自动改派'};iv[fm.id].push({s:t,e:t+(.5+1.5*r())*H,st:'stop',note:'自动停领'})}
    else if(type==='ltx')ev={t:restoreStart-(.2+1.8*r())*H,type,mid:m.id,result:'已重试'};
    else if(type==='ffprobe')ev={t:restoreStart-(.2+1.8*r())*H,type,mid:m.id,result:'已手动处理'};
    else ev={t:tDone-(.3+4*r())*H,type,mid:'ctrl',result:'已手动处理'};
    ev.code=code;ev.res=res;
    if(ev.t<=NOW){if(!f.done&&(type==='whitelist'||type==='ffprobe'))ev.result='需要处理';events.push(ev)}
   }
  }
 }
 for(let day=GEN_START,di=0;day<NOW;day+=DAY,di++){
  const r=rng(41,di);
  if(r()<.3){const t=day+r()*DAY,d=(4+41*r())*MIN;if(t<NOW)events.push({t,type:'trans',mid:'ctrl',dur:d,result:'已自动恢复',note:'中断 '+fSpan(d)})}
  const nc=3+Math.floor(r()*6);
  for(let k=0;k<nc;k++){const t=day+r()*DAY;if(t<NOW)events.push({t,type:'cpu',mid:'ctrl',result:'已自动恢复',note:'CPU '+(88+Math.floor(r()*11))+'%'})}
  BASE_GPUS.forEach((m,mi)=>{const q=rng(53,mi,di);if(q()<.07){const s=day+q()*DAY,d=(10+80*q())*MIN;if(s<NOW&&!(bushOff&&m.id==='bush'&&s>BUSH_OFF-3*H)){iv[m.id].push({s,e:Math.min(s+d,NOW),st:'off',note:'重启 / 系统更新'});events.push({t:s,type:'offline',mid:m.id,result:'已自动恢复',note:'离线 '+fSpan(d)})}}});
 }
 if(bushOff){iv.bush.push({s:BUSH_OFF,e:NOW,st:'off',note:'送修中'});events.push({t:BUSH_OFF,type:'offline',mid:'bush',result:'已改派在途影片',note:'送修中'})}
 if(spike){
  const mv=films.filter(f=>f.moved==='gor').sort((a,b)=>a.restoreEnd-b.restoreEnd);
  for(let k=0;k<9;k++){const t=SPIKE_START+k*(SPIKE_STOP-SPIKE_START-MIN)/8,f=mv[k];events.push({t,type:'4551',mid:'gor',code:f?f.code:'—',res:f?f.res:null,result:'已自动改派',spike:true,note:'WinError 4551'});if(k<8)iv.gor.push({s:t+2*MIN,e:t+20*MIN,st:'stop',note:'自动停领'})}
  iv.gor.push({s:SPIKE_STOP,e:NOW,st:'stop',note:'连续拦截后自动停领，待检查'});
 }
 const inflight=films.filter(f=>f.tIn<NOW-4*H&&!f.done);
 if(inflight[0])events.push({t:NOW-52*MIN,type:'whitelist',mid:'ctrl',code:inflight[0].code,res:inflight[0].res,result:'需要处理',note:'刮削站点不在白名单内'});
 if(inflight[1])events.push({t:NOW-3*H-17*MIN,type:'ffprobe',mid:'bsp',code:inflight[1].code,res:inflight[1].res,result:'需要处理',note:'Blacksilverpig 缺少 ffprobe'});
 Object.keys(iv).forEach(k=>{iv[k]=iv[k].filter(x=>x.s<NOW).map(x=>({...x,e:Math.min(x.e,NOW)})).sort((a,b)=>a.s-b.s)});
 events.sort((a,b)=>b.t-a.t);
 return {films,events,iv,fleet};
}
const DATA={};
const data=()=>DATA[S.sc]||(DATA[S.sc]=gen(S.sc));
function stateAt(d,mid,t){const m=d.fleet.find(x=>x.id===mid);if(m&&m.joined&&t<m.joined)return 'none';let st='on';for(const x of d.iv[mid]||[]){if(t>=x.s&&t<x.e){if(x.st==='off')return 'off';st='stop'}}return st}
function uptime(d,mid,s,e){
 const m=d.fleet.find(x=>x.id===mid);if(m&&m.joined)s=Math.max(s,m.joined);
 if(e<=s)return null;
 const segs=(d.iv[mid]||[]).map(x=>[Math.max(x.s,s),Math.min(x.e,e),x.st]).filter(x=>x[1]>x[0]);
 const union=st=>{let tot=0,cs=0,ce=-1;segs.filter(x=>x[2]===st).forEach(([a,b])=>{if(a>ce){if(ce>cs)tot+=ce-cs;cs=a;ce=b}else ce=Math.max(ce,b)});if(ce>cs)tot+=ce-cs;return tot};
 const off=union('off'),stop=union('stop');return {on:1-off/(e-s),off,stop,span:e-s};
}

const S={sc:'bush',page:'analytics',range:'7d',machine:'all',res:'all',compare:false,view:{},sort:{k:'model',d:1},hideCpu:true,refreshed:NOW+12e3};
const SCEN=[['normal','正常'],['bush','Bushpig 送修'],['spike','有异常'],['cover','真实覆盖'],['expand','扩容后（6 台 GPU）']];
const RANGES=[['24h','24 小时'],['7d','7 天'],['30d','30 天'],['90d','90 天'],['all','全部']];

const STAGE={queue:['排队等待','var(--c-queue)'],restore:['修复（LTX）','var(--c1)'],asr:['ASR','var(--c3)'],trans:['翻译','var(--c4)'],scrape:['刮削','var(--c5)'],archive:['归档','var(--c6)'],total:['全程','var(--c-total)']};
const coverOf=()=>S.sc==='cover'?COVER:DATA_START;

/* ===================== ranges + buckets ===================== */
function rangeDef(k){
 const cover=coverOf();let edges=[],kind;
 const push=(s,step,n)=>{for(let i=0;i<=n;i++)edges.push(s+i*step)};
 if(k==='24h'){kind='h';push(NOW-24*H,H,24)}
 else if(k==='7d'){kind='d';push(TODAY-6*DAY,DAY,7)}
 else if(k==='30d'){kind='d';push(TODAY-29*DAY,DAY,30)}
 else if(k==='90d'){kind='w';push(TODAY+DAY-91*DAY,7*DAY,13)}
 else{ // 全部: from the first record; monthly buckets once the span exceeds 120 days
  const span=NOW-cover;
  if(span>120*DAY){kind='m';const d0=dt(cover);let y=d0.getUTCFullYear(),mo=d0.getUTCMonth();edges.push(Date.UTC(y,mo,1));while(edges[edges.length-1]<=NOW){mo++;if(mo>11){mo=0;y++}edges.push(Date.UTC(y,mo,1))}}
  else if(span>45*DAY){kind='w';for(let t=cover;;t+=7*DAY){edges.push(t);if(t>NOW)break}}
  else{kind='d';for(let t=cover;;t+=DAY){edges.push(t);if(t>NOW)break}}
 }
 const n=edges.length-1,start=edges[0],end=edges[n],len=end-start;
 const bs=i=>edges[i],be=i=>edges[i+1];
 const idx=t=>{if(t<start||t>=end)return -1;let lo=0,hi=n-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(edges[mid]<=t)lo=mid;else hi=mid-1}return lo};
 const fixed=k!=='all'||kind!=='m';
 const short=i=>kind==='h'?fHM(bs(i)):kind==='m'?pad(dt(bs(i)).getUTCMonth()+1)+'月':fMD(bs(i));
 const title=i=>{const s=bs(i),e=be(i);if(kind==='h')return fMD(s)+' '+fHM(s)+'–'+fHM(e);if(kind==='d')return fMD(s)+' '+fWk(s)+(s===TODAY?'（截至 15:00）':'');if(kind==='m')return fYM(s)+(e>NOW?'（截至今天）':'');return fMD(s)+' – '+fMD(e-DAY)+(e>NOW?'（截至今天）':'')};
 const name={'24h':'过去 24 小时','7d':'过去 7 天','30d':'过去 30 天','90d':'过去 90 天',all:'全部记录'}[k];
 const unit={h:'每小时',d:'每天',w:'每周',m:'每月'}[kind];
 return {k,edges,n,start,end,len,bs,be,idx,pidx:t=>fixed?idx(t+len):-1,short,title,name,unit,kind,prevStart:start-len,prevEnd:start,hasPrev:k!=='all'};
}

/* ===================== filter + aggregate (one dataset, every section) ===================== */
function compute(){
 const d=data(),R=rangeDef(S.range),cover=coverOf(),mf=S.machine,ctrl=mf==='ctrl';
 const resOk=x=>S.res==='all'||x===S.res;
 const pool=d.films.filter(f=>f.done&&f.tDone>=cover&&resOk(f.res)&&(mf==='all'||ctrl||f.m===mf));
 const within=(t,s,e)=>t>=s&&t<e;
 const cur=pool.filter(f=>within(f.tDone,R.start,R.end));
 const prevOk=R.hasPrev&&R.prevStart>=cover;
 const prev=prevOk?pool.filter(f=>within(f.tDone,R.prevStart,R.prevEnd)):null;
 const evPool=d.events.filter(e=>e.t>=cover&&(mf==='all'||(ctrl?e.mid==='ctrl':e.mid===mf))&&(!e.res||resOk(e.res)));
 const ev=evPool.filter(e=>within(e.t,R.start,R.end));

 const mkRows=marks.map(([l,n])=>{const p=c.length?n/c.length*100:0;return {label:l,segs:[{v:p,color:'var(--c1)'}],value:fPct(p),tip:{title:'标识：'+l,rows:[{color:'var(--c1)',value:fPct(p),label:'占完成影片'},{value:n+' 部',label:''}]}}});
 const one=[{name:'影片',color:'var(--c1)'}];
 return panel('src','片源与片库','收进来的片子是什么样，以及归档进了哪些演员目录',{
  chart:()=>h('div',{},inboxCard(A.d),h('div',{class:'divider'}),h('div',{class:'grid2'},
   block('输入大小','原片大小分布，单位 GB',chart((el,w)=>colChart(el,w,{n:9,series:[{...one[0],vals:sz}],tick:szL,tickAll:w>420,h:190,labelMax:true,label:'输入大小分布',tip:i=>({title:szL(i)+' GB',rows:[{color:'var(--c1)',value:sz[i]+' 部',label:'影片'}]})}),190)),
   block('片长','视频时长分布，单位小时',chart((el,w)=>colChart(el,w,{n:5,series:[{...one[0],vals:du}],tick:duL,tickAll:true,h:190,labelMax:true,label:'片长分布',tip:i=>({title:duL(i)+' 小时',rows:[{color:'var(--c1)',value:du[i]+' 部',label:'影片'}]})}),190)),
   block('归档最多的演员（前 8）','只统计进主片库演员目录的影片',top.length?chart((el,w)=>hbarChart(el,w,{rows:aRows,lw:90,vw:52,label:'归档最多的演员'}),hbarH(aRows)):h('p',{class:'small muted'},'这个时段没有数据')),
   block('标识占比','一部片可以同时有多个标识',chart((el,w)=>hbarChart(el,w,{rows:mkRows,lw:90,vw:52,max:100,label:'标识占比'}),hbarH(mkRows))))),
  table:()=>h('div',{},inboxCard(A.d),h('div',{class:'divider'}),h('div',{class:'grid2'},
   dtable([{l:'输入大小（GB）'},{l:'影片',num:1}],sz.map((v,i)=>[szL(i),v]),'输入大小'),dtable([{l:'片长（小时）'},{l:'影片',num:1}],du.map((v,i)=>[duL(i),v]),'片长'),
   dtable([{l:'演员'},{l:'影片',num:1}],top.map(([n,v])=>[n,v]),'归档最多的演员'),dtable([{l:'标识'},{l:'影片',num:1},{l:'占比',num:1}],marks.map(([l,n])=>[l,n,fPct(c.length?n/c.length*100:0)]),'标识占比')))});
}

/* ===================== shell ===================== */
const NAV=[['overview','概览','grid'],['pending','待处理','list','pend'],['queue','影片队列','film',4],['review','待确认','review',3],['exceptions','异常','alert','exc'],['devices','设备','monitor'],['local','本机','laptop'],['library','片库与规则','folder'],['analytics','数据分析','chart',null,true],['prefs','设置','sliders']];
function navItems(d){
 const pend=inboxNow(d).pending,exc=d.events.filter(e=>e.result==='需要处理').length+d.fleet.filter(m=>stateAt(d,m.id,NOW-1)!=='on'&&!m.joined).length;
 return NAV.map(([k,l,ic,n,isNew])=>{const cnt=n==='pend'?pend:n==='exc'?exc:n;
  return h('button',{type:'button',class:'nav-item','data-act':'nav','data-k':k,'aria-current':S.page===k?'page':null},isNew?h('span',{class:'dot',title:'新增页面'}):null,icon(ic),h('span',{},l),cnt?h('span',{class:'nav-count'},cnt):null)});
}
function render(){
 const d=data();
 $('#scenario-seg').replaceChildren(...SCEN.map(([k,l])=>h('button',{type:'button',class:'seg-opt',role:'radio','aria-checked':String(S.sc===k),'data-act':'scenario','data-k':k,id:'sc-'+k},l)));
 const label=NAV.find(n=>n[0]===S.page)[1];
 const live=d.fleet.filter(m=>!m.joined),offs=live.filter(m=>stateAt(d,m.id,NOW-1)==='off'),stops=live.filter(m=>stateAt(d,m.id,NOW-1)==='stop');
 const onl=d.fleet.filter(m=>stateAt(d,m.id,NOW-1)!=='off').length;
 $('#app').replaceChildren(
  h('div',{class:'scope-banner'},h('span',{},'TaskPaw / 媒体处理中心 / '+label),h('div',{class:'health','aria-label':'运行状态'},
   h('span',{class:'chip green'},icon('check'),'主控正常'),
   h('span',{class:'chip '+(offs.length?'amber':'green')},`GPU ${onl} / ${d.fleet.length} 在线`),
   ...offs.map(m=>h('span',{class:'chip red'},icon('off'),m.name+' 离线')),...stops.map(m=>h('span',{class:'chip amber'},icon('pause'),m.name+' 停领')),
   ...d.fleet.filter(m=>m.joined).map(m=>h('span',{class:'chip blue'},icon('plus'),m.name+' 新加入')))),
  h('nav',{class:'mobile-nav','aria-label':'媒体处理中心导航（窄屏）'},navItems(d)),
  h('div',{class:'workspace-shell'},h('aside',{class:'workspace-rail'},h('div',{class:'workspace-heading'},h('strong',{},'媒体处理中心'),h('span',{class:'small muted'},'主控 · 本机')),h('nav',{class:'nav-group','aria-label':'媒体处理中心导航'},navItems(d))),
   h('main',{class:'content',id:'main',tabindex:'-1'})));
 if(S.page!=='analytics'){
  $('#main').append(h('div',{class:'page-title'},h('h1',{},label)),h('div',{class:'untouched'},icon('info'),h('h2',{style:'color:var(--text)'},'本次不改动'),h('p',{class:'small'},'沿用现有页面。本预览只涉及带紫点的「数据分析」。'),h('button',{type:'button',class:'btn small','data-act':'nav','data-k':'analytics'},'去看数据分析')));
  return;
 }
 $('#main').append(h('div',{id:'topbar'}),h('div',{id:'sections'}));
 renderTop();renderSections();
}
function renderTop(){
 const keep=document.activeElement&&document.activeElement.id;
 const d=data(),cover=coverOf(),R=rangeDef(S.range);
 const seg=(name,opts,cur,act)=>h('div',{class:'seg',role:'radiogroup','aria-label':name},opts.map(([k,l])=>h('button',{type:'button',class:'seg-opt',role:'radio','aria-checked':String(cur===k),'data-act':act,'data-k':k,id:`f-${act}-${k}`},l)));
 const sel=h('select',{id:'f-machine','aria-label':'机器'},h('option',{value:'all'},'全部 GPU 机器'),
  ...MODEL_ORDER.map(md=>{const ms=d.fleet.filter(m=>m.model===md);return ms.length?h('optgroup',{label:md+' × '+ms.length},ms.map(m=>h('option',{value:m.id},m.name+(m.joined?'（新加入）':'')))):null}),
  h('optgroup',{label:'主控'},h('option',{value:'ctrl'},'本机（BlackGoldPig）')));
 if(!d.fleet.some(m=>m.id===S.machine)&&S.machine!=='ctrl')S.machine='all';
 sel.value=S.machine;
 const notice=R.start<cover?h('div',{class:'notice amber',style:'margin-bottom:16px'},icon('alert'),h('div',{},`所选时段早于数据记录起点（${fMD(cover)}），只统计 ${Math.ceil((NOW-cover)/DAY)} 天。图中灰色区域没有记录。`)):null;
 $('#topbar').replaceChildren(
  h('div',{class:'page-title'},h('div',{class:'page-title-main'},h('h1',{},'数据分析'),h('span',{class:'page-sub'},`处理量、耗时、用电与设备健康 · 数据自 ${dt(cover).getUTCFullYear()}-${fMD(cover)} 起`)),
   h('div',{class:'refresh-meta'},h('span',{},'最后刷新 ',h('span',{class:'mono',id:'refreshed'},fMD(S.refreshed)+' '+fHM(S.refreshed)+':'+pad(dt(S.refreshed).getUTCSeconds()))),h('span',{class:'chip green'},icon('refresh'),'自动刷新 · 每 30 秒'))),
  h('div',{class:'filterbar',role:'group','aria-label':'筛选（作用于下方全部内容）'},
   h('div',{class:'fgroup'},h('span',{},'时段 · 过去'),seg('时段',RANGES,S.range,'range')),
   h('label',{class:'fgroup',for:'f-machine'},h('span',{},'机器'),sel),
   h('div',{class:'fgroup'},h('span',{},'分辨率'),seg('分辨率',[['all','全部'],['4K','4K'],['1080P','1080P']],S.res,'res')),
   h('div',{class:'switch-l'},h('button',{type:'button',class:'toggle',role:'switch','aria-checked':String(S.compare),'aria-labelledby':'lbl-compare','data-act':'compare',id:'f-compare',disabled:R.hasPrev?null:true,title:R.hasPrev?null:'「全部」没有上一周期'}),h('span',{id:'lbl-compare'},'对比上一周期'))),
  ...(notice?[notice]:[]));
 if(keep){const el=document.getElementById(keep);if(el&&el!==document.activeElement)el.focus()}
}
function renderSections(){
 const keep=document.activeElement&&document.activeElement.id;
 CH=[];hideTip();
 const A=compute();
 $('#sections').replaceChildren(kpiRow(A),secProduction(A),secMachines(A),secController(A),secDurations(A),secEnergy(A),secUptime(A),secAlerts(A),secSources(A));
 drawCharts();
 $('#live').textContent=`已更新：${A.R.name} · ${S.machine==='all'?'全部 GPU 机器':mName(S.machine)} · ${S.res==='all'?'全部分辨率':S.res} · 完成 ${A.cur.length} 部`;
 if(keep){const el=document.getElementById(keep);if(el&&el!==document.activeElement)el.focus({preventScroll:true})}
}
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let fadeT;
function refresh(){ // filter change: keep the frame, fade the old render briefly, then redraw
 renderTop();const sec=$('#sections');if(!sec)return;
 sec.classList.add('busy');clearTimeout(fadeT);
 fadeT=setTimeout(()=>{renderSections();sec.classList.remove('busy')},RM?0:170);
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const a=t.dataset.act,k=t.dataset.k;
 switch(a){
  case 'scenario':S.sc=k;if(k==='cover'&&S.range==='7d')S.range='30d';render();break;
  case 'nav':S.page=k;render();break;
  case 'range':S.range=k;if(k==='all')S.compare=false;refresh();break;
  case 'res':S.res=k;refresh();break;
  case 'compare':S.compare=!S.compare;refresh();break;
  case 'view':S.view[k]=t.dataset.v;renderSections();break;
  case 'sort':S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='name'||k==='st'?1:-1};renderSections();break;
  case 'pick-machine':S.machine=S.machine===k?'all':k;refresh();break;
  case 'machine-all':S.machine='all';refresh();break;
  case 'hidecpu':S.hideCpu=!S.hideCpu;renderSections();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='f-machine'){S.machine=e.target.value;refresh()}});
document.addEventListener('keydown',e=>{
 const el=e.target;
 if((e.key==='Enter'||e.key===' ')&&el.matches&&el.matches('tr[data-act]')){e.preventDefault();el.click();return}
 if(el.matches&&el.matches('[data-rove]')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
  const grp=[...el.closest('[data-rove-group]').querySelectorAll('[data-rove]')];let i=grp.indexOf(el);
  i=e.key==='Home'?0:e.key==='End'?grp.length-1:clamp(i+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1),0,grp.length-1);
  e.preventDefault();grp.forEach(g=>g.setAttribute('tabindex','-1'));grp[i].setAttribute('tabindex','0');grp[i].focus();
 }
 if(e.key==='Escape')hideTip();
});
let lastW=0,rT;
new ResizeObserver(es=>{const w=es[0].contentRect.width;if(Math.abs(w-lastW)>2){lastW=w;clearTimeout(rT);rT=setTimeout(drawCharts,120)}}).observe(document.getElementById('app'));
setInterval(()=>{S.refreshed+=30e3;const el=document.getElementById('refreshed');if(el)el.textContent=fMD(S.refreshed)+' '+fHM(S.refreshed)+':'+pad(dt(S.refreshed).getUTCSeconds())},30e3);
render();
})();
</script>
