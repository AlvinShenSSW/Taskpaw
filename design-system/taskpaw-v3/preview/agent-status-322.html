<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 当前任务 · #322 预览</title>
<style>
:root{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--line:#475569;--text:#f8fafc;--muted:#b6c3d4;--accent:#91bdff;--transfer:#7edce9;--warn:#f2cb72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums;font-family:Consolas,monospace}.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar{margin-bottom:16px}.card{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:16px;min-width:0}.primary{border-color:var(--accent)}.name{font-size:24px;margin:6px 0}.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid currentColor;border-radius:5px;color:var(--accent);font-size:13px}.badge svg{width:16px;height:16px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.step{padding:4px 10px;border:1px dashed var(--line);border-radius:5px;color:var(--muted)}.step.active{border-style:solid;border-color:var(--accent);color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:12px;background:var(--bg);border-radius:8px}.metric strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}progress{width:100%;height:8px;accent-color:var(--accent)}button,select{font:inherit;min-height:44px;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);cursor:pointer;transition:border-color .2s}button:hover,select:hover{border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.detail{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}.secondary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.note{color:var(--warn)}p{margin:8px 0}.wrap{overflow-wrap:anywhere}.minor{font-size:13px}.stage{margin-bottom:14px}@media(max-width:600px){main{padding:12px}.card{padding:16px}.metrics{grid-template-columns:1fr}.secondary{grid-template-columns:1fr}.name{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main>
<div class="bar"><div><h1>媒体处理</h1><span class="muted minor">Agent 布局预览 · 示例数据</span></div><label>预览状态 <select id="state"><option value="run">修复中</option><option value="upload">回传中</option><option value="finish">提交结果</option><option value="stop">停止未确认</option><option value="offline">等待重连</option></select></label></div>
<section class="card"><div class="row"><div><b id="connection">在线 · 已对账</b><span class="muted" id="heartbeat">　心跳 2 秒前</span></div><button type="button" id="pause">暂停领取</button></div><p class="muted minor" id="connection-detail">主控：已连接 · 凭据有效</p><p id="paused" class="note" hidden>已暂停领取：进行中的任务、回传和预取继续。</p></section>
<section class="card primary" aria-label="当前任务"><div class="row"><span class="muted">当前任务</span><span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span id="phase">LTX · 去噪</span></span></div><h2 class="name mono wrap">EXAMPLE-001</h2>
<div class="steps"><span class="step">下载完成</span><span class="step active" id="restore">修复</span><span class="step" id="upload">回传</span></div>
<div class="metrics"><div class="metric"><span class="muted">当前阶段进度</span><strong id="percent">64%</strong><progress id="progress" max="100" value="64"></progress></div><div class="metric"><span class="muted">本次任务已用</span><strong>18 分 32 秒</strong></div><div class="metric"><span class="muted" id="metric-label">当前处理</span><strong id="metric-value">去噪 16 / 25</strong></div></div>
<div class="detail"><p id="detail">LTX 3 / 4 · 去噪 · 剩余约 6 分钟</p><p class="muted minor" id="parameters">本片参数 · 1080p · 预设 standard</p><p class="note" id="notice" hidden></p></div></section>
<section class="card"><h2>预取与排队</h2><div class="secondary"><div><b class="mono">EXAMPLE-002</b><p class="muted">下载源文件</p></div><div class="mono">12.4 / 38.0 GB · 610 MB/s</div></div></section>
<section class="card"><div class="row"><span>暂存 <span class="mono">76.0 / 500.0 GB</span></span><span>GPU · 媒体任务占用</span></div></section>
</main><script>
const $=id=>document.getElementById(id);let paused=false;
$('pause').onclick=()=>{paused=!paused;$('paused').hidden=!paused;$('pause').textContent=paused?'恢复领取':'暂停领取'};
$('state').onchange=()=>{const state=$('state').value,run=state==='run'||state==='offline',upload=state==='upload';$('phase').textContent=({run:'LTX · 去噪',upload:'回传中',finish:'提交结果',stop:'停止未确认',offline:'LTX · 去噪'})[state];$('connection').textContent=state==='offline'?'连接中 · 等待对账':'在线 · 已对账';$('heartbeat').textContent=state==='offline'?'　上次心跳 45 秒前':'　心跳 2 秒前';$('connection-detail').textContent=state==='offline'?'主控：等待重连 · 凭据有效':'主控：已连接 · 凭据有效';$('percent').textContent=run?'64%':upload?'30%':'暂无进度';$('progress').hidden=!run&&!upload;$('progress').value=run?64:30;$('metric-label').textContent=run?'当前处理':'传输';$('metric-value').textContent=run?'去噪 16 / 25':upload?'120 MB/s':'—';$('restore').classList.toggle('active',run);$('upload').classList.toggle('active',upload||state==='finish');$('parameters').hidden=!run;$('detail').textContent=run?'LTX 3 / 4 · 去噪 · 剩余约 6 分钟':upload?'回传成品 1.2 / 4.0 GB':state==='finish'?'等待主控确认接收结果':state==='stop'?'停止未确认：任务进程仍在运行':'连接恢复并对账后继续更新';$('notice').hidden=(run&&state!=='offline')||upload;$('notice').textContent=state==='finish'?'结果尚未获主控确认':state==='stop'?'正在确认任务是否停止':'主控连接中：本机处理继续，等待重连后对账'};
</script></html>
