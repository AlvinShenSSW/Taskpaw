function progress(f,expanded=false){const isLtx=['encode','denoise'].includes(f.status);if(!isLtx){const text={translate:'中文翻译 · 112 / 240 条字幕',return:'成品包回传 · 3 / 4 个文件已校验',scrape:'Miko 正在整理元数据、字幕与最终封面',receiving:'后台检查收件内容，稍后自动继续',postprocess_error:'最终封面尚未通过检查',match:'正在比对演员索引与别名',inbox:'等待符合分辨率的设备领取'}[f.status]||statusMeta[f.status][0];return `<div class="film-stage"><span>${esc(text)}</span></div><div class="stage-detail"><span>${f.status==='return'?'传输计数与影片流程进度分开显示':'此阶段不提供影片总体百分比'}</span></div>`}return `<div class="film-stage"><strong class="green">${f.status==='encode'?'Encode / 编码':'Denoise / 去噪'}</strong><span class="mono">${f.percent}% <span class="muted small">本阶段</span></span></div><div class="progress" role="progressbar" aria-label="${esc(f.title)} ${f.status} 本阶段进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${f.percent}"><span style="width:${f.percent}%"></span></div><div class="stage-detail"><span class="mono">${f.current} / ${f.total} ${f.status==='encode'?'帧':'步'}</span><span class="mono">${f.rate} ${f.unit}</span></div>${expanded?`<div class="mini-metrics"><div><label>阶段速率</label><strong>${f.rate} <small>${f.unit}</small></strong></div><div><label>阶段已用</label><strong>${f.elapsed}</strong></div><div><label>阶段剩余</label><strong>${f.eta}</strong></div></div><div class="divider"></div><div class="keyline">LTX 本次运行剩余 <strong class="mono blue">${f.runEta}</strong></div><p class="small muted spacer-top">由阶段日志提供；不包含翻译、回传、刮削与入库。未观测到的阶段不会显示“已完成”。</p>`:''}`}
function row(f){return `<article class="film-row">${cover(f)}<div class="film-body"><div class="film-title"><h3>${esc(f.title)}</h3><span class="chip">${f.resolution}</span></div><div class="meta"><span class="mono">${f.id}</span><span>${f.device||'主控编排'}</span><span>演示影片</span></div>${progress(f)}</div><button class="btn ghost icon-btn" data-action="detail" data-id="${f.id}" aria-label="查看 ${esc(f.title)} 详情">${icon('chevron')}</button></article>`}
function overview(){const active=state.films.filter(f=>activeStates.includes(f.status)),review=state.films.filter(f=>reviewStates.includes(f.status)),exceptions=state.films.filter(f=>exceptionStates.includes(f.status));return heading('WORKFLOW / 全局工作流','让每一部影片，顺利归位。','从人工投片到验证入库，持续处理；只在演员与目标路径需要您决定时停下。',button(`${icon(state.paused?'play':'pause')}${state.paused?'恢复新领取':'暂停新领取'}`,'pause','','ghost')+button(`待确认 <span class="mono">${review.length}</span>${icon('arrow')}`,'nav','data-page="review"','primary'))+(state.paused?'<div class="notice amber">'+icon('pause')+'<div><strong>主控已暂停新领取</strong><p>在途修复、翻译、回传与已确认入库继续运行。各设备的本机停止需在本机操作。</p></div></div>':'')+`<div class="stats"><div class="panel stat"><div class="label">正在处理${icon('spark')}</div><strong>${active.length}<em>部影片</em></strong><div class="note">2 部 LTX · 其余步骤分别计数</div></div><div class="panel stat"><div class="label">等待您的确认${icon('review')}</div><strong class="amber">${review.length}<em>部影片</em></strong><div class="note">按影片核对演员与最终路径</div></div><div class="panel stat"><div class="label">需要处理${icon('alert')}</div><strong>${exceptions.length}<em>项异常</em></strong><div class="note">含入库未知、来源清理待重试</div></div><div class="panel stat"><div class="label">计算设备${icon('device')}</div><strong>5<em>/ 5 在线</em></strong><div class="note">2 × 16 GB · 3 × 8 GB</div></div></div><div class="flow-strip" aria-label="各流程阶段影片数量">${[['收件',state.films.filter(f=>f.status==='inbox').length,'inbox'],['修复 / 字幕',state.films.filter(f=>['encode','denoise','translate'].includes(f.status)).length,'processing'],['回传 / 刮削',state.films.filter(f=>['return','scrape','match'].includes(f.status)).length,'preparing'],['待确认',review.length,'review'],['入库 / 清理',state.films.filter(f=>['unknown','cleanup'].includes(f.status)).length,'archive'],['完成',state.films.filter(f=>f.status==='completed').length,'completed']].map(([name,count,key])=>`<button class="flow-stage ${key==='review'?'attention':''}" data-action="flow" data-filter="${key}"><span>${name}</span><b>${count}</b></button>`).join('')}</div><div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>正在处理</h2><p>当前阶段与设备 · 不合成影片总体百分比</p></div><button class="link-btn" data-action="nav" data-page="queue">全部队列${icon('arrow')}</button></div><div class="film-list">${active.slice(0,4).map(row).join('')}</div><div class="queue-summary"><span>另有 ${Math.max(0,active.length-4)} 部正在刮削 / 匹配</span><span class="mono">FIXTURE / 静态快照</span></div></section><section class="panel"><div class="panel-head"><div><h2>安全抵达之后，再清理来源</h2><p>正式片库永不作为清理目标</p></div>${icon('shield')}</div><div class="panel-body"><div class="steps-list no-margin"><span class="step">确认目标与清单</span><span class="step">不覆盖提交</span><span class="step">完整校验与回执</span><span class="step">来源身份复核</span><span class="step">清理清单内原片</span></div></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><div><h2>下一步，需要您</h2><p>图文核对 · 一部一确认</p></div><span class="chip amber">${review.length} 待确认</span></div>${review.slice(0,2).map(f=>`<div class="review-peek"><div class="top">${cover(f)}<div><h3>${f.title}</h3><p>${f.actor} · ${f.resolution}</p>${status(f)}</div></div><div class="actions">${button(`核对入库${icon('arrow')}`,'review',`data-id="${f.id}"`,f.status==='ready'?'primary small':'small')}</div></div>`).join('')||'<div class="empty">待确认已处理</div>'}</section><section class="panel"><div class="panel-head"><h2>设备协作</h2><button class="link-btn" data-action="nav" data-page="devices">查看${icon('arrow')}</button></div>${devices.map(d=>`<div class="device-mini"><div class="device-meta"><span class="device-icon">${icon(d.local?'local':'device')}</span><div><div class="name">${d.gpu} <span class="muted">${d.vram}</span></div><div class="desc">${d.id}${d.local?' · 本机 + 主控':''}</div></div></div><span class="chip ${d.vram==='16 GB'?'blue':''}">${d.vram==='16 GB'?'4K 优先':'仅 1080p'}</span></div>`).join('')}</section></div></div>`}

function card(f){return `<article class="panel film-card"><div class="top">${cover(f)}<div class="film-body"><div class="film-title"><h3>${f.title}</h3></div><div class="meta"><span>${f.id} · ${f.resolution}</span></div><div class="meta">${f.actor}</div><div style="margin-top:8px">${status(f)}</div></div></div>${progress(f)}<div class="card-foot"><span>${f.device||f.source}</span>${button('查看详情','detail',`data-id="${f.id}"`,'ghost small')}</div></article>`}
function queue(){let films=state.films.filter(f=>matchesStage(f)&&(state.resolution==='all'||f.resolution===state.resolution)&&`${f.title} ${f.id} ${f.actor}`.toLowerCase().includes(state.search.toLowerCase()));return heading('FILM QUEUE / 影片队列','每部影片，一条完整记录。','修复、字幕、回传与归档共享影片身份；原始输入与处理后的成品包分别记录。',button(`${icon('folder')}收件规则`,'nav','data-page="settings"','ghost'))+`<div class="toolbar"><div class="filters"><select id="stage-filter" aria-label="按影片阶段筛选">${[['all','全部阶段'],['inbox','收件待领取'],['processing','修复 / 字幕'],['preparing','回传 / 刮削 / 匹配'],['review','待确认'],['archive','入库 / 来源清理'],['completed','已完成'],['skipped','已跳过']].map(([v,l])=>`<option value="${v}" ${state.stage===v?'selected':''}>${l}</option>`).join('')}</select><select id="resolution-filter" aria-label="按分辨率筛选"><option value="all">全部分辨率</option><option ${state.resolution==='4K'?'selected':''}>4K</option><option ${state.resolution==='1080p'?'selected':''}>1080p</option></select><span class="chip">${films.length} 部</span></div><div class="search-wrap">${icon('search')}<input class="input search" id="film-search" type="search" placeholder="搜索影片、演员或编号" aria-label="搜索影片、演员或编号" value="${esc(state.search)}"></div></div><div class="queue-grid">${films.map(card).join('')}</div>${!films.length?empty('没有符合条件的影片','试试更改阶段、分辨率或搜索词。'):''}`}

function devicesPage(){return heading('DEVICES / 设备协作','五台设备，各司其职。','2 台 16 GB 显卡优先处理 4K；3 台 8 GB 显卡只领取 1080p。主控电脑也是其中一台 Agent。')+`<div class="notice">${icon('info')}<div>Mac 信息桥单独展示只读信息，不计入这 5 台计算设备，也不接受影片任务。暂停新领取不终止在途任务。</div></div><div class="device-grid">${devices.map(deviceCard).join('')}</div>`}
function localPage(){const d=devices[4],f=state.localDemo?film(state.localDemo):null;return heading('LOCAL AGENT / 本机','主控电脑，也是您的本机 Agent。','GPU-05 · Windows · RTX 5060 8 GB。这一页只控制本机任务；其他四台设备继续独立运行。',button(state.localDraining?'取消本机排空':'本机排空','local-drain','','ghost')+button(`${icon(state.localPaused?'play':'stop')}${state.localPaused?'恢复本机领取':'停止本机任务'}`,'local-control','','danger'))+`<div class="notice ${state.localPaused?'amber':''}">${icon('local')}<div>${state.localPaused?'本机已停止领取；其他设备与 Hub 主控继续运行。':state.localDraining?'本机正在排空：在途任务继续，只停止本机新的领取。':'本机兼任主控与 GPU Agent，不需要另一套窗口或第二份设备卡。'}</div></div><div class="two-col"><div class="stack">${deviceCard(d)}<section class="panel"><div class="panel-head"><h2>本机任务</h2><span class="chip">只显示 GPU-05</span></div>${f?row(f):`<div class="empty"><h2>本机当前空闲</h2><p>全局队列中的 4K 影片不会派给这台 8 GB 设备。</p><div class="actions" style="justify-content:center;margin-top:18px">${button('载入本机 1080p 演示任务','local-demo',state.localPaused||state.localDraining?'disabled':'','ghost')}</div></div>`}</section></div><section class="panel"><div class="panel-head"><h2>两个控制范围</h2></div><div class="panel-body"><h3>主控 · 暂停新领取</h3><p class="small muted spacer-top">作用于全局调度，只阻止新的领取；不会杀死在途任务。</p><div class="divider"></div><h3>本机 · 排空 / 停止任务</h3><p class="small muted spacer-top">排空只阻止本机新领取，在途任务继续。停止则终止 GPU-05 的任务并暂停领取，保留来源；其他机器与 Hub 继续。</p><div class="divider"></div><button class="link-btn" data-action="nav" data-page="overview">回到全局工作流${icon('arrow')}</button></div></section></div>`}
function libraries(){return heading('LIBRARIES & RULES / 片库与规则','目标明确，正式片库受保护。','4 个虚构 NAS，16 个逻辑库根。这里只展示演示别名，不包含真实 UNC、凭据或片源路径。',button(`${icon('settings')}目录映射向导`,'nav','data-page="settings"','ghost'))+`<div class="library-grid">${['A','B','C','D'].map((letter,index)=>`<section class="panel"><div class="panel-head"><div><h2>NAS-${letter}</h2><p>逻辑连接 · 目标库根 4 个</p></div><span class="chip ${letter==='D'&&!state.nasRestored?'red':'green'}">${letter==='D'&&!state.nasRestored?'演示：离线':'演示：在线'}</span></div><div class="panel-body"><div class="root-list">${[1,2,3,4].map(n=>`<div class="root-item"><strong>${letter}0${n}</strong> · 演示库根<p>演员目录 / 影片包</p><p>${letter==='C'&&n===3&&!state.permissionRestored?'演示：写入受限':'禁止覆盖 · 禁止库内删除'}</p></div>`).join('')}</div><button class="link-btn spacer-top" data-action="actor-index" data-nas="${letter}">查看演示演员索引${icon('arrow')}</button></div></section>`).join('')}</div><section class="panel spacer-top"><div class="panel-head"><h2>入库与来源清理规则</h2>${icon('shield')}</div><div class="panel-body rule-list">${[['输入与成品分开建清单','原始收件影片、既有 NFO / srt 与处理成品拥有独立身份，不能把成品目录当作原片目录。'],['先验证完整入库，再清理','目标文件包须完整校验、生成持久回执，再检查原始输入身份；确认后才删除清单内来源文件。'],['只重试未完成的清理','来源被占用或机器离线时保留“已入库 · 待清理”；恢复后不重新修复、刮削或上传。'],['正式片库永不成为清理根','仅允许注册收件根内的清单文件；映射盘、别名、路径重叠与替换文件都必须重新校验。']].map(([title,desc])=>`<div class="rule"><h3>${title}</h3><p>${desc}</p></div>`).join('')}</div></section>`}
function bridge(){return heading('READ-ONLY BRIDGE / Mac 信息桥','看得到进展，不接管计算。','独立只读信息入口：状态、事件与有界日志。Mac 不加入计算设备池，不提供派单、停止或文件删除。',button(`${icon('refresh')}模拟刷新快照`,'bridge-refresh','','ghost'))+`<div class="notice ${state.bridgeFresh?'green':'amber'}">${icon(state.bridgeFresh?'check':'clock')}<div><strong>${state.bridgeFresh?'演示快照已更新':'快照已过期 · 最后收到：12 分钟前'}</strong><p>事件序号存在缺口：DEMO-104 → DEMO-108。${state.bridgeFresh?'刷新不会把历史缺口当成已补齐。':'旧数据保留并标记，不推断任务已完成。'}</p></div></div><div class="tabs" aria-label="Mac 信息桥视图">${[['status','状态'],['events','事件'],['logs','有界日志']].map(([key,label])=>`<button class="tab" data-action="bridge-tab" data-tab="${key}" aria-pressed="${state.bridgeTab===key}">${label}</button>`).join('')}</div><section class="panel"><div class="panel-head"><div><h2>Mac 信息桥 · DEMO-MAC</h2><p>只读 · 不属于计算设备清单</p></div><span class="chip ${state.bridgeFresh?'green':'amber'}">${state.bridgeFresh?'当前演示快照':'过期'}</span></div><div class="panel-body">${state.bridgeTab==='status'?`<dl class="facts"><dt>最后观测状态</dt><dd>演示同步任务运行中</dd><dt>新鲜度</dt><dd>${state.bridgeFresh?'刚刚（模拟）':'12 分钟前，当前状态未知'}</dd><dt>事件完整性</dt><dd class="amber">缺少 DEMO-105 至 DEMO-107</dd><dt>权限范围</dt><dd>状态 / 事件 / 脱敏日志只读</dd><dt>禁止操作</dt><dd>派单、终止进程、文件读写、远程删除</dd></dl>`:state.bridgeTab==='events'?`<ol class="events"><li class="event"><time>10:42:19</time><div>DEMO-108 · 观测到服务心跳<p>快照不包含缺失事件的补录。</p></div></li><li class="event"><time>缺口</time><div class="amber">DEMO-105 — DEMO-107 未收到<p>不据此推断成功、失败或静默空闲。</p></div></li><li class="event"><time>10:30:02</time><div>DEMO-104 · 演示任务开始<p>信息桥不拥有此任务的执行控制权。</p></div></li></ol>`:`<p class="small muted" style="margin-bottom:12px">仅演示最近 5 行 · 上限 200 行 / 64 KiB · 读取不足会标记截断</p><pre class="terminal">[DEMO 10:30:02] observed: task started\n[DEMO 10:30:03] source: &lt;redacted&gt;\n[DEMO 10:30:04] worker: running\n[DEMO 10:42:19] heartbeat received\n[DEMO] EVENT GAP: 105..107 / history incomplete</pre>`}</div></section>`}
function sourceTree(){return state.sourceShape==='actor'?'收件根 INBOX（演示）\n└─ 演员目录（虚构）\n   └─ 影片目录 F08\n      ├─ source-video.mp4\n      ├─ existing.nfo\n      └─ existing.zh.srt':state.sourceShape==='film'?'收件根 INBOX（演示）\n└─ 影片目录 F08\n   ├─ source-video.mp4\n   ├─ existing.nfo\n   └─ existing.zh.srt':'收件根 INBOX（演示）\n├─ source-video.mp4\n├─ existing.nfo\n└─ existing.zh.srt\n\n无法唯一归属的伴随文件 → 人工确认'}
function settings(){let body='';if(state.wizard===1)body=`<div class="form-grid"><div><div class="field"><label for="source-shape">收件目录结构</label><select id="source-shape"><option value="actor" ${state.sourceShape==='actor'?'selected':''}>演员 / 影片 / 文件</option><option value="film" ${state.sourceShape==='film'?'selected':''}>影片 / 文件</option><option value="flat" ${state.sourceShape==='flat'?'selected':''}>平铺文件（歧义进入待确认）</option></select></div><div class="divider"></div><h3>已经有 NFO / srt 时</h3><label class="option-card spacer-top"><input type="radio" name="existing" value="preserve" ${state.existing==='preserve'?'checked':''}><span>校验并复用有效元数据 / 字幕<p>原文件不动；仍会完成 Miko 全套后处理并更新最终封面。字幕按实际语言与非空内容判断。</p></span></label><label class="option-card" style="margin-top:10px"><input type="radio" name="existing" value="review" ${state.existing==='review'?'checked':''}><span>先人工核对再复用<p>不覆盖原文件；新产物写入独立工作区。</p></span></label></div><div><div class="section-label">来源结构预览 · 虚构名称</div><pre class="tree">${sourceTree()}</pre><p class="small muted spacer-top">直接复制到主控指定的普通文件夹即可。后台检查文件是否稳定、是否仍在写入，并核验媒体和一致副本后自动处理；无需专用投递器或 ready 文件。实际变化、仍被占用或身份暂不可确认时保留来源。</p></div></div>`;if(state.wizard===2)body=`<div class="notice">${icon('device')}<div>主控和本机 Agent 位于同一台 Windows 机器。此处为角色预览，不会启动或迁移服务。</div></div><div class="rule-list">${devices.map(d=>`<div class="rule"><h3>${d.id} · ${d.gpu} ${d.vram}</h3><p>${d.local?'Hub 主控 + 本机 Agent':'独立计算 Agent'} · ${d.rule}</p></div>`).join('')}<div class="rule"><h3>Mac 信息桥 · 只读</h3><p>状态 / 事件 / 有界日志；不会注册为第六台计算机。</p></div></div>`;if(state.wizard===3)body=`<div class="notice amber">${icon('shield')}<div>清理白名单只包含 主控唯一的默认收件根 INBOX。NAS-A/B/C/D 的 16 个正式库根及其别名、父子重叠路径都禁止成为清理根。</div></div><dl class="facts"><dt>原始输入</dt><dd>输入机器 + 主控 INBOX + 固定输入清单；Agent 的 WORK 目录为受控副本</dd><dt>工作区 / 成品</dt><dd>独立处理目录；与原始收件目录分离</dd><dt>NAS 目标</dt><dd>NAS-A/B/C/D × 各 4 个库根 = 16 个</dd><dt>入库授权</dt><dd>影片版本 + 演员 + 精确目标 + 成品包 + 来源清单</dd><dt>清理前提</dt><dd>完整入库回执 + 输入身份未变 + 单一清理持有者</dd></dl><div class="divider"></div><p class="small muted">没有唯一目标、权限不足、离线、同名冲突均阻止自动入库。手动选择后仍须重新预检与图文确认。</p>`;if(state.wizard===4)body=`<div class="notice ${state.setupSaved?'green':''}">${icon(state.setupSaved?'check':'info')}<div>${state.setupSaved?'模拟向导已完成；配置仅在当前页面内存中。':'迁移仅做预检。目标运行模式：托管后台服务 + 连接式窗口，关闭窗口不停止后台；现有伴随进程模式须显式迁移，不静默改变退出行为。'}</div></div><dl class="facts"><dt>收件结构</dt><dd>${{actor:'演员 / 影片 / 文件',film:'影片 / 文件',flat:'平铺文件；歧义转人工'}[state.sourceShape]}</dd><dt>已有 NFO / srt</dt><dd>${state.existing==='preserve'?'校验后复用，不覆盖':'先人工核对，不覆盖'}</dd><dt>设备</dt><dd>5 台，含主控本机；8 GB 节点拒绝 4K</dd><dt>路径映射</dt><dd>默认 1 个中央收件根 / 16 个目标库根，必须互不重叠</dd><dt>安全迁移顺序</dt><dd>盘点全部 Hub 监控 → 暂停新领取 → 等待在途任务 → 保存历史与回滚点 → Windows 唯一 Hub 接管 → 验证恢复</dd><dt>来源清理</dt><dd>完整回执之后，仅清理入库授权清单中身份未变的原片及伴随文件</dd></dl><div class="divider"></div><label class="check"><input id="setup-ack" type="checkbox" ${state.setupSaved?'checked':''}>我理解此处只预览规则，不会迁移服务或修改任何真实目录。</label>`;return heading('SETUP & MIGRATION / 设置与迁移','先把边界说清楚。','按现有目录结构接入，识别已有 NFO / 字幕；保留工作区与来源清理的独立身份。')+`<div class="wizard-steps">${[['收件与已有文件',1],['设备与角色',2],['库根与清理边界',3],['迁移预检',4]].map(([title,n])=>`<button class="wizard-step" data-action="wizard" data-step="${n}" ${state.wizard===n?'aria-current="step"':''}><span>${n}</span>${title}</button>`).join('')}</div><section class="panel"><div class="panel-head"><h2>${['','收件与已有文件','设备与角色','库根与清理边界','迁移预检'][state.wizard]}</h2><span class="chip">步骤 ${state.wizard} / 4</span></div><div class="panel-body">${body}<div class="wizard-foot">${button('上一步','wizard',`data-step="${state.wizard-1}" ${state.wizard===1?'disabled':''}`,'ghost')}${state.wizard<4?button('下一步 '+icon('arrow'),'wizard',`data-step="${state.wizard+1}"`,'primary'):button('保存演示规则','save-setup',state.setupSaved?'':'disabled','primary')}</div></div></section>`}
const renderers={overview,queue,review:reviewPage,exceptions,devices:devicesPage,local:localPage,libraries,bridge,settings};
function render(){const nav=navHTML();$('#navigation').innerHTML=nav;$('#mobile-navigation').innerHTML=nav;$('#breadcrumb').textContent=state.page==='overview'?'全局工作流':pages.find(p=>p[0]===state.page)[1];$('#claim-status').textContent=state.paused?'新领取已暂停':'可领取新任务';$('#claim-status').className='chip '+(state.paused?'amber':'green');$('#main').innerHTML=renderers[state.page]()+footer();document.title=`TaskPaw · ${pages.find(p=>p[0]===state.page)[1]} · 设计演示`}
function navigate(page,focus=true){if(!renderers[page])return;state.page=page;location.hash=page;render();if($('#nav-dialog').open)$('#nav-dialog').close();if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4800)}
function showDialog(title,subtitle,body,foot='',drawer=false){const d=$('#dialog');if(!d.open)lastFocus=document.activeElement;d.className='modal'+(drawer?' drawer':'');d.innerHTML=`<div class="modal-head"><div><h2 id="dialog-title" tabindex="-1">${title}</h2><p>${subtitle}</p></div><button class="btn ghost icon-btn" data-action="close" aria-label="关闭对话框">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!d.open)d.showModal();$('#dialog-title',d).focus({preventScroll:true});}
function closeDialog(){const d=$('#dialog');if(d.open)d.close();dialogState=null;}
$('#dialog').addEventListener('close',()=>{if($('#dialog').open)return;if(lastFocus&&document.contains(lastFocus))lastFocus.focus();else $('#main').focus({preventScroll:true});dialogState=null});

function packageFiles(f){const files=[['video.mp4','修复成品']];if(f.subtitle==='zh_nonempty')files.push(['video.zh.srt','中文字幕 · 已验证非空']);files.push(['movie.nfo','本次 Miko 元数据'],['poster.jpg','本次 Miko 最终封面']);if(f.multipart)files.push(['folder.jpg','多视频 / 分卷目录封面 · 与最终 poster 一致']);return files}
function packageList(f){return `<ul class="package-list">${packageFiles(f).map(([name,note])=>`<li><span>${name}</span><span>${note}</span></li>`).join('')}</ul>`}
function cleanupReason(f){return f.cleanupChanged||f.sourceCheck==='changed'?'来源内容或文件集合已变化':f.sourceCheck==='writing'?'来源文件仍被占用':f.sourceCheck==='unknown'?'暂时无法确认来源':f.inputCheck!=='passed'?'等待收件检查':f.cleanupBlocked?'来源文件暂时被占用':''}
function inputEvidence(f){return `<details class="spacer-top"><summary class="link-btn">查看后台检查记录</summary><dl class="facts spacer-top"><dt>收件检查</dt><dd>${f.inputCheck==='passed'?'已通过：稳定检查、写占用检查、媒体探测及一致副本校验':'等待检查；尚未进入计算'}</dd><dt>完整性边界</dt><dd>普通目录的可处理快照；不声称知道外部复制工具是否已传完全部原件。</dd><dt>成品版本</dt><dd>DEMO-PACK-${f.id}-R${f.revision} · DEMO-HASH-${f.id}-R${f.revision}</dd><dt>来源版本</dt><dd>DEMO-INPUT-${f.id}-R${f.inputRevision} · 原身份 / 内容 / 成员分别复核</dd><dt>封面版本</dt><dd>MIKO-POSTER-${f.id}-R${f.posterRevision}</dd><dt>清理边界</dt><dd>只处理本次输入清单；新增文件、其他影片、父目录和 NAS 正式片库均不删除。</dd></dl></details>`}
function finalOutput(f){return `<section class="panel panel-body spacer-top"><h3>${f.postprocess==='passed'?'本次 Miko 最终成品':'Miko 完整后处理'}</h3><p class="small muted spacer-top">${f.postprocess==='passed'?'元数据、文件整理、字幕与最终封面已检查。封面标识由 Miko 生成，展示实际成果。':'即使已有 NFO 或封面，也先在独立工作区完成 Miko 后处理；最终封面尚未就绪。'}</p><p class="small spacer-top">${f.subtitle==='no_speech'?'本片演示为无语音，不宣称已完成中文字幕。':f.postprocess==='passed'?'字幕：已验证的非空中文字幕。':'字幕成果待后处理核对。'}</p>${f.postprocess==='passed'?packageList(f):''}${f.postprocess==='failed'?'<div class="notice amber spacer-top">最终封面缺失或标识不一致，暂不能进入入库确认。</div>':''}</section>`}
function detail(id){const f=film(id);dialogState={type:'detail',id};const isLtx=['encode','denoise'].includes(f.status);showDialog('影片详情',`${f.id} · 所有数据均为演示`,`<div class="detail-hero">${cover(f,'large')}<div><h2>${f.title}</h2><div class="chips">${status(f)}<span class="chip">${f.resolution}</span></div><p>${f.actor}</p><p>来源：主控收件目录 INBOX · ${f.device||'主控自动处理'}</p></div></div>${isLtx?`<div class="detail-progress">${progress(f,true)}</div>`:`<div class="notice">${icon('info')}<div>${statusMeta[f.status][0]}${f.status==='receiving'?'：后台检查后自动继续，无需提交文件或写 ready 标记。':''}</div></div>`}${finalOutput(f)}<dl class="facts spacer-top"><dt>目标</dt><dd>${target(f)}</dd><dt>原始来源</dt><dd>主控 INBOX / ${f.id} · 本次收件 3 项</dd><dt>入库结果</dt><dd>${f.receipt||'尚未入库'}</dd><dt>来源清理</dt><dd>${f.cleaned?'本次来源已清理（演示）':f.receipt?(cleanupReason(f)||'等待后台清理'):'入库完成后自动检查并清理本次来源'}</dd></dl>${inputEvidence(f)}<details class="spacer-top"><summary class="link-btn">演示场景切换</summary><div class="actions spacer-top">${f.status==='receiving'?button('模拟收件检查与后续处理通过','intake-demo',`data-id="${id}"`,'ghost'):''}${['scrape','postprocess_error'].includes(f.status)?button('模拟最终封面缺失','miko-fail',`data-id="${id}"`,'ghost')+button('模拟完整后处理通过','miko-pass',`data-id="${id}"`,'ghost'):''}${reviewStates.includes(f.status)?button('模拟入库时来源变化','source-change-demo',`data-id="${id}"`,'ghost'):''}</div><p class="small muted spacer-top">仅跳转固定演示结果，不执行后台任务、不读取文件。</p></details>`,`<p>阶段结果与来源清理分别记录。</p><div class="actions">${reviewStates.includes(f.status)?button('查看并确认入库','review',`data-id="${f.id}"`,'primary'):exceptionStates.includes(f.status)?button(exceptionInfo(f)[2],'exception',`data-id="${f.id}"`,'primary'):button('关闭','close','','ghost')}</div>`,true)}

function reviewBlock(f,s){if(f.status==='unknown')return '入库结果待核对，暂不能重新上传。';if(!reviewStates.includes(f.status))return '影片尚未完成准备，稍后自动继续。';if(f.inputCheck!=='passed')return '等待收件检查，暂不能入库。';if(f.postprocess!=='passed'||!f.posterReady||!f.marksValid||(f.multipart&&!f.folderReady))return '最终封面或文件包尚未准备好，请先处理。';if(s.revision!==f.revision||s.inputRevision!==f.inputRevision||s.posterRevision!==f.posterRevision)return '成品或来源已更新，请重新查看后确认。';if(['offline','permission','duplicate'].includes(f.status))return {offline:'目标 NAS 暂时离线，请稍后重试。',permission:'目标暂不可写，请检查权限后重试。',duplicate:'目标已有同名影片包，不能覆盖；请打开文件夹核对。'}[f.status];if(!s.root||!s.actor)return f.status==='multi'?'请选择演员与目标路径。':'请选择演员与目标，或打开文件夹核对。';return ''}

function review(id,keep=false){const f=film(id);if(!keep||dialogState?.id!==id||dialogState?.type!=='review')dialogState={type:'review',id,root:f.root,actor:f.status==='nomatch'?'':f.actor,revision:f.revision,inputRevision:f.inputRevision,posterRevision:f.posterRevision};const s=dialogState,blocked=reviewBlock(f,s);let choices=f.status==='multi'?`<h3>选择演员与目标</h3><div class="candidate-list">${[['A03','演员夜航','NAS-A / A03'],['B02','演员夜航乙','NAS-B / B02']].map(([r,a,desc])=>`<button class="candidate" data-action="candidate" data-root="${r}" data-actor="${a}" aria-pressed="${s.root===r}"><strong>${a}</strong><span>${desc}</span></button>`).join('')}</div>`:'';if(f.status==='nomatch')choices=`<div class="form-grid spacer-top"><div class="field"><label for="manual-actor">演员</label><select id="manual-actor"><option value="">请选择演员</option>${['演员新岛','演员远岸','演员山海'].map(a=>`<option ${s.actor===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="manual-root">NAS / 库根</label><select id="manual-root"><option value="">请选择目标</option>${['A','B','C','D'].flatMap(l=>[1,2,3,4].map(n=>{const r=`${l}0${n}`;return `<option value="${r}" ${s.root===r?'selected':''} ${(l==='D'&&!state.nasRestored)||(r==='C03'&&!state.permissionRestored)?'disabled':''}>NAS-${l} / ${r}</option>`})).join('')}</select></div></div>`;showDialog('确认影片与入库目标','入库完成后自动清理本次收件来源',`<div class="confirmation-layout">${cover(f)}<div><div class="eyebrow">${f.id} · MIKO 最终封面演示</div><h3>${f.title}</h3><div class="chips"><span class="chip">${f.resolution}</span><span class="chip green">${f.postprocess==='passed'?'本次后处理已完成':'后处理待完成'}</span></div><p>演员：<strong>${esc(s.actor||'待选择')}</strong></p><p>${f.subtitle==='zh_nonempty'?'修复成品 · 中文字幕已核对':'修复成品 · 无语音，不加中文字幕标识'}</p><p class="small muted">原创几何图模拟最终封面，不含真实素材。</p></div></div>${choices}${blocked?`<div class="notice amber spacer-top">${icon('alert')}<div>${blocked}</div></div>`:''}<div class="target-box"><h3>${icon('library')} 入库到</h3><div class="target-path">${s.root?`NAS-${s.root[0]} / 库根 ${s.root} / ${esc(s.actor)} / ${f.id}`:'尚未选择完整目标'}</div><p class="small muted spacer-top">保留所有已有片源；同名冲突不会覆盖。</p></div><details open><summary class="link-btn">最终文件包 · ${packageFiles(f).length} 个文件</summary>${packageList(f)}</details><details class="source-box"><summary class="link-btn">入库后清理：主控 INBOX / ${f.id} · 3 个来源文件</summary><ul class="package-list"><li>source-video.mp4</li><li>existing.nfo</li><li>existing.zh.srt</li></ul><p>只处理本次收件来源；若文件发生变化或仍被占用，将保留并显示待清理。</p></details>${inputEvidence(f)}`,`<p>${blocked?'处理后重新确认即可。':'一次确认即可，剩余步骤由后台完成。'}</p><div class="actions">${button('打开文件夹','folder-info',`data-id="${id}"`,'ghost')}${blocked&&s.revision!==f.revision?button('重新查看','review',`data-id="${id}"`,'ghost'):''}${button('确认入库','approve',`data-id="${id}" ${blocked?'disabled':''}`,'primary')}</div>`)}

function approval(id){const f=film(id),s=dialogState;if(!s||s.type!=='review'||s.id!==id||reviewBlock(f,s))return;f.root=s.root;f.actor=s.actor;f.approval={film:id,revision:f.revision,inputRevision:f.inputRevision,posterRevision:f.posterRevision,actor:s.actor,target:target(f),packageHash:`DEMO-HASH-${id}-R${f.revision}`,files:packageFiles(f).map(x=>x[0]),sourceManifest:`DEMO-INPUT-${id}-R${f.inputRevision}`,sourceIdentity:`DEMO-IDENTITY-${id}`,cleanup:true};f.receipt=`DEMO-RCPT-${id}`;const reason=cleanupReason(f);f.status=reason?'cleanup':'completed';f.cleaned=!reason;render();dialogState={type:'receipt',id};showDialog(reason?'已入库 · 待清理':'入库完成',`${f.title} · 仅演示，不读写真实文件`,`<div class="receipt"><h3>${icon('check')} 成品已入库</h3><p>${target(f)}</p></div><p class="spacer-top">${reason?`${reason}，来源已保留；后台仅继续处理清理，不重复上传。`:'本次收件来源已清理，已有 NAS 片库保持不变。'}</p><details class="spacer-top"><summary class="link-btn">查看入库记录</summary><dl class="facts spacer-top"><dt>入库回执</dt><dd>${f.receipt}</dd><dt>最终成品</dt><dd>${packageFiles(f).length} / ${packageFiles(f).length} 文件校验 · Miko 版本 R${f.revision}</dd><dt>来源复核</dt><dd>${reason||'身份、内容与成员一致'}</dd><dt>清理记录</dt><dd>${f.cleaned?'仅本次清单 3 个文件，模拟完成':'未删除；仅保留清理待办'}</dd></dl></details>`,`<p>确认绑定本次影片、目标与文件版本。</p><div class="actions">${button('查看影片记录','detail',`data-id="${id}"`,'ghost')}${button('继续下一部','next-review','','primary')}</div>`);toast(reason?'成品已入库，来源待清理。':'入库与本次来源清理完成（模拟）。')}

function exceptionAction(id){const f=film(id);if(f.status==='postprocess_error'){detail(id);return}if(f.status==='unknown'){dialogState={type:'reconcile',id};showDialog('先核对入库结果','结果未知期间：禁止重复上传，禁止来源清理',`<div class="notice amber">${icon('alert')}<div>${f.title} 的目标提交后连接中断。目前无法确定是否已有完整成品。</div></div><dl class="facts"><dt>目标</dt><dd>${target(f)}</dd><dt>本地记录</dt><dd>提交意图存在，最终回执未收到</dd><dt>必须核对</dt><dd>目标影片包、文件身份、完整校验与入库事务一致</dd><dt>不允许</dt><dd>盲目重传、覆盖同名包、先删来源</dd></dl><div class="divider"></div><h3>选择一种演示核对结果</h3><p class="small muted spacer-top">这两个按钮仅用于预览成功核对与仍不确定的分支。</p>`,`<p>真实产品须由核对结果驱动状态，不能由按钮伪造成功。</p><div class="actions">${button('模拟：仍无法确定','reconcile-hold',`data-id="${id}"`,'ghost')}${button('模拟：完整回执已验证','reconcile-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='cleanup'&&(f.cleanupChanged||['changed','unknown'].includes(f.sourceCheck))){handoff(id);toast('输入身份或完整性未通过，禁止清理；需人工核对。');}else if(f.status==='cleanup'){dialogState={type:'cleanup',id};showDialog('仅重试来源清理','不重新修复、不重新刮削、不重复上传',`<div class="receipt"><h3>成品包已验证入库</h3><p>回执 ${f.receipt} · ${target(f)}</p></div><dl class="facts"><dt>允许清理</dt><dd>${f.source} / DEMO-INPUT-${id} 内 3 个原始文件</dd><dt>上次失败</dt><dd>源文件被占用（演示）</dd><dt>重试检查</dt><dd>当前回执、收件根授权、输入身份与内容、唯一清理持有者</dd><dt>若文件变了</dt><dd>立即保留来源并转人工核对</dd></dl><div class="notice amber spacer-top">${icon('shield')}<div>不会遍历删除收件目录，也不会把 NAS 正式片库当作清理根。</div></div>`,`<p>模拟重试前会重新核对身份。</p><div class="actions">${button('模拟：输入已变化','cleanup-changed',`data-id="${id}"`,'ghost')}${button('模拟身份一致并重试','cleanup-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='duplicate'){review(id)}else if(['offline','permission'].includes(f.status)){dialogState={type:'retry',id};showDialog('恢复后重新预检','连接与权限恢复后仍须重新核对目标',`<div class="notice amber">${icon('alert')}<div>${f.title} · ${statusMeta[f.status][0]}。此演示不会访问任何 NAS。</div></div><p>模拟恢复只把影片送回“待确认”。原片保留，不自动上传，也不沿用过期的确认授权。</p>`,`<p>下一步仍是按影片图文确认。</p><div class="actions">${button('取消','close','','ghost')}${button('模拟恢复并返回待确认','retry-ok',`data-id="${id}"`,'primary')}</div>`)}else if(f.status==='stopped'){f.status='inbox';f.device=null;state.localDemo=null;render();closeDialog();toast('影片已回到待领取队列；来源保留。')}}
function more(id){const f=film(id);dialogState={type:'more',id};showDialog('异常处理选项',`${f.title} · ${f.id}`,`<div class="notice">${icon('info')}<div>跳过仅停止本流程继续处理，保留来源。人工接管保留任务记录与文件身份；不会授予 NAS 删除或覆盖权限。</div></div>${f.status==='unknown'?'<p class="amber small">入库结果未知仍需核对。跳过不会把未知结果标为成功，也不会清理来源。</p>':''}`,`<p>所有操作仅为演示状态变更。</p><div class="actions">${button('查看影片','detail',`data-id="${id}"`,'ghost')}${button('人工接管','handoff',`data-id="${id}"`,'ghost')}${button('跳过并保留来源','skip',`data-id="${id}"`,'danger')}</div>`)}
function handoff(id){const f=film(id);dialogState={type:'handoff',id};showDialog('人工接管这部影片',`${f.title} · 来源始终保留`,`<div class="confirmation-layout">${cover(f)}<div><h3>${f.title}</h3><p>输入位置：${f.source} / 演示输入 ${id}</p><p>成品位置：工作区 / 演示成品 ${id}</p><p>真实产品应打开当前影片的注册文件夹，并保留原输入与目标身份。此原型只展示交接卡。</p></div></div><div class="notice amber">${icon('shield')}<div>手工处理后重新扫描核对。不能仅凭“我已处理”生成入库回执或自动删除来源。</div></div>`,`<p>当前没有文件夹或真实路径可打开。</p><div class="actions">${button('模拟打开文件夹说明','folder-info',`data-id="${id}"`,'ghost')}${button('标记人工接管，保留来源','handoff-ok',`data-id="${id}"`,'primary')}</div>`)}
document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav){event.preventDefault();navigate(nav.dataset.nav);return}const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,id=btn.dataset.id;switch(a){case'nav':navigate(btn.dataset.page);break;case'menu':$('#nav-dialog').showModal();break;case'close-nav':$('#nav-dialog').close();break;case'close':closeDialog();break;case'reset':closeDialog();state=initial();navigate('overview');toast('已重置全部虚构影片与演示规则。');break;case'pause':state.paused=!state.paused;render();toast(state.paused?'已暂停新的领取；所有在途任务继续。':'已恢复新任务领取。');break;case'flow':state.stage=btn.dataset.filter;navigate('queue');break;case'detail':detail(id);break;case'review':review(id);break;case'review-filter':state.reviewFilter=btn.dataset.filter;render();break;case'exception-filter':state.exceptionFilter=btn.dataset.filter;render();break;case'candidate':dialogState.root=btn.dataset.root;dialogState.actor=btn.dataset.actor;review(dialogState.id,true);break;case'approve':approval(id);break;case'intake-demo':{const f=film(id);f.inputCheck='passed';f.status='ready';f.postprocess='passed';f.posterReady=true;f.marksValid=true;f.folderReady=true;render();detail(id);toast('模拟收件检查及后续阶段完成；真实处理由后台逐阶段推进。');break}case'miko-fail':{const f=film(id);f.postprocess='failed';f.posterReady=false;f.status='postprocess_error';f.approval=null;render();detail(id);break}case'miko-pass':{const f=film(id);f.postprocess='passed';f.posterReady=true;f.marksValid=true;f.folderReady=true;f.revision++;f.posterRevision++;f.approval=null;f.status='ready';render();detail(id);break}case'source-change-demo':film(id).sourceCheck='changed';detail(id);toast('模拟归档后来源复核发现变化：来源将保留。');break;case'next-review':{const next=state.films.find(f=>f.status==='ready');if(next)review(next.id);else{closeDialog();navigate('review')}break}case'exception':exceptionAction(id);break;case'exception-more':more(id);break;case'retry-ok':if(film(id).status==='offline')state.nasRestored=true;if(film(id).status==='permission')state.permissionRestored=true;film(id).status='ready';render();review(id);toast('模拟预检通过；仍需重新确认入库。');break;case'reconcile-hold':closeDialog();toast('仍为入库结果未知：不重传、不清理来源。');break;case'reconcile-ok':film(id).status='cleanup';film(id).receipt=`DEMO-RCPT-${id}`;render();exceptionAction(id);toast('模拟已核对完整回执。接下来只处理来源清理。');break;case'cleanup-ok':if(film(id).cleanupChanged||['changed','writing','unknown'].includes(film(id).sourceCheck)||film(id).inputCheck!=='passed'){toast('输入身份或完整性未通过，禁止清理。');break}film(id).cleanupBlocked=false;film(id).status='completed';film(id).cleaned=true;render();closeDialog();toast('仅重试来源清理成功（模拟）；未重复上传。');break;case'cleanup-changed':film(id).cleanupChanged=true;closeDialog();render();showDialog('来源身份变化：已阻止清理','原始文件可能被替换；成品仍保持已入库状态',`<div class="notice red">${icon('shield')}<div>DEMO-INPUT-${id} 的当前文件身份与入库授权不一致。来源完整保留，需要人工核对。</div></div><p class="small muted">重新授权前不得清理，也不需要重复上传已入库的成品。</p>`,`<p>演示已阻止本次清理。</p><div class="actions">${button('人工接管','handoff',`data-id="${id}"`,'primary')}</div>`);break;case'skip':{const f=film(id);f.previousStatus=f.status;if(f.status==='unknown'||f.status==='cleanup'){f.autoPaused=true}else{f.status='skipped'};f.keepSource=true;closeDialog();render();toast('已跳过并保留来源；既有目标与未知入库记录未改动。');break}case'handoff':handoff(id);break;case'handoff-ok':{const f=film(id);f.manual=true;closeDialog();render();toast('已标记人工接管，保留来源；原状态与核对义务保留。');break}case'folder-info':toast('演示交接位置：'+film(id).source+' / '+id+'。未打开真实文件夹。');break;case'bridge-tab':state.bridgeTab=btn.dataset.tab;render();break;case'bridge-refresh':state.bridgeFresh=true;render();toast('模拟快照已刷新；历史事件缺口仍保留。');break;case'wizard':state.wizard=Number(btn.dataset.step);render();break;case'save-setup':if($('#setup-ack')?.checked){state.setupSaved=true;render();toast('演示规则已保存在本页内存；未修改配置或迁移服务。')}break;case'actor-index':showDialog('演示演员索引',`NAS-${btn.dataset.nas} · 虚构目录与别名`,`<dl class="facts"><dt>演员星河</dt><dd>别名：星河甲 / 星河（演示）</dd><dt>演员夜航</dt><dd>同名候选存在于 NAS-A / A03 与 NAS-B / B02</dd><dt>匹配结果</dt><dd>仅提供候选。多候选与无匹配必须人工选择。</dd><dt>索引边界</dt><dd>只读正式库根中的目录信息；不自动合并、重命名或删除已有演员目录。</dd></dl>`,`<p>真实姓名、头像与实际索引均未读取。</p><div class="actions">${button('关闭','close','','ghost')}</div>`);break;case'local-drain':state.localDraining=!state.localDraining;render();toast(state.localDraining?'本机排空：在途任务继续，新的领取暂停；其余设备不变。':'已取消本机排空。');break;case'local-demo':{const f=film('F07');if(!state.localPaused&&!state.localDraining){f.status='denoise';f.device='GPU-05';Object.assign(f,{percent:18,current:'22',total:'120',rate:'2.86',unit:'s/step',elapsed:'01:03',eta:'04:40',runEta:'07:20'});state.localDemo=f.id;render();toast('已载入本机 1080p 演示任务；其他设备不变。')}break}case'local-control':if(state.localPaused){state.localPaused=false;render();toast('本机恢复领取，已停止影片仍在队列中等待重新安排。')}else showDialog('仅停止本机任务','作用范围：GPU-05 / RTX 5060 8 GB',`<div class="notice amber">${icon('stop')}<div>停止本机在途任务并暂停本机新领取。保留来源与阶段结果；Hub 主控以及其他四台设备继续运行。</div></div><p class="small muted">${state.localDemo?'当前本机演示任务：'+film(state.localDemo).title:'本机当前空闲；确认后仅暂停本机领取。'}</p>`,`<p>此操作不暂停全局队列，不停止其他机器。</p><div class="actions">${button('取消','close','','ghost')}${button('确认仅停止本机','local-stop','','danger')}</div>`);break;case'local-stop':state.localPaused=true;if(state.localDemo)film(state.localDemo).status='stopped';render();closeDialog();toast('仅本机已停止；其他设备与 Hub 继续运行。');break}});
document.addEventListener('change',event=>{const el=event.target;switch(el.id){case'stage-filter':state.stage=el.value;render();break;case'resolution-filter':state.resolution=el.value;render();break;case'manual-actor':case'manual-root':{const focused=el.id;dialogState[el.id==='manual-actor'?'actor':'root']=el.value;review(dialogState.id,true);$('#'+focused)?.focus();break}case'source-shape':state.sourceShape=el.value;state.setupSaved=false;render();$('#source-shape').focus();break;case'setup-ack':$('[data-action="save-setup"]').disabled=!el.checked;break}if(el.name==='existing'){state.existing=el.value;state.setupSaved=false;}});
document.addEventListener('input',event=>{if(event.target.id==='film-search'){const start=event.target.selectionStart;state.search=event.target.value;render();const input=$('#film-search');input.focus();try{input.setSelectionRange(start,start)}catch{/* search input selection is browser dependent */}}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(renderers[page]&&state.page!==page)navigate(page,false)});
$('#brand').innerHTML=paw+'<div>TaskPaw<small>MEDIA WORKSPACE</small></div>';
$('[data-action="menu"]').innerHTML=icon('menu');$('[data-action="close-nav"]').innerHTML=icon('close');
const initialPage=location.hash.slice(1);if(renderers[initialPage])state.page=initialPage;render();
</script>

<script>

let v2Mode='controller',v2Outer='workflow',remoteTab='monitors',remoteMonitor='jasna';
let registry=[],deviceDraft=null,remotePaused=false,remoteStopped=false,componentView='components';
const sourceOverview=overview,sourceFooter=footer;
const baselineRegistry=devices.map((d,i)=>({...d,address:`demo-node-${i+1}.invalid`,port:'5680',ram:i===4?64:32,free:420,workRoot:`WORK-${i+1}`,requested1080:true,requested4k:i<2,profile4k:i<2,verified:true,paired:true,credential:'active',enabled:true,draining:false,retired:false,online:true,unknown:false,active:!!d.job,history:[],probeAt:'演示：刚刚',vramNumber:parseInt(d.vram,10),pairGeneration:1}));

function roleTabs(){return v2Mode==='ordinary'?[['monitors','监控'],['logs','任务日志'],['settings','设置']]:v2Mode==='controller'?[['fleet','机群'],['manage','管理'],['events','事件 / 日志'],['local','本机监控'],['settings','设置'],['workflow','影片工作流']]:[['monitors','监控'],['logs','任务日志'],['resources','资源'],['connection','连接'],['settings','设置']]}

function controllerSettings(){return v2Heading('设置','保留 TaskPaw 现有设置；新增工作流组件与连接方式配置，不再安装第二个桌面主界面。')+`<div class="tabs v2-settings-tabs"><button class="tab" data-v2="settings-view" data-view="components" aria-pressed="${componentView==='components'}">影片工作流组件</button><button class="tab" data-v2="settings-view" data-view="existing" aria-pressed="${componentView==='existing'}">原有设置</button><button class="tab" data-v2="settings-view" data-view="lifecycle" aria-pressed="${componentView==='lifecycle'}">服务与窗口</button></div>${componentView==='existing'?`<div class="panel panel-body"><h2>原有设置继续保留</h2><div class="rule-list spacer-top"><div class="rule"><h3>连接 / 认证 / 通知</h3><p>所有机器的监控、事件、日志与通知统一迁入 Windows Hub；工作流池只是已授权子集。Hub 与本机 Agent 的控制凭据仍分别校验。</p></div><div class="rule"><h3>语言 / 外观 / 关于</h3><p>继续使用 TaskPaw 的 V3 主题、语言和版本管理。</p></div></div></div>`:componentView==='lifecycle'?`<div class="notice">${icon('info')}<div>目标模式是后台托管服务 + 连接式窗口。现有伴随进程模式须经安装器明确迁移；不能因为新增页签就宣称关闭窗口不会停止旧后台。</div></div><section class="panel panel-body"><dl class="facts"><dt>主控后台</dt><dd>Hub + 本机 Agent + 主控专用适配组件</dd><dt>远端后台</dt><dd>Agent + worker + 模型运行时</dd><dt>停止控制</dt><dd>主控排空、单机排空、单机停止，权限与作用范围分开</dd><dt>迁移</dt><dd>预检、暂停领取、等待在途、备份、唯一主控切换与回滚</dd></dl></section>`:`<div class="notice green">${icon('settings')}<div><strong>Miko / Filmpaw 是主控管理的后台组件。</strong>由 TaskPaw 主控安装器安装、校验版本、启动、更新与回滚；正常使用仍在这一个窗口。远端计算节点不安装它们。<p class="small spacer-top">保留普通 TaskPaw 使用；只有显式启用影片工作流才选择主控或计算 Agent。工作流角色向导一次性完成目录、硬件配对、模型下载确认与预检，自动建立必要执行配置与任务观测，无需手工添加 Jasna 或新监控。普通监控注册不等于工作流准入，不下载 LTX、不自动领取影片；发现翻译服务也不代表获准调用。</p><p class="small spacer-top">现有“添加监控”继续用于手动任务；升级不会自动启用或启动旧任务。工作流与手动任务共用同一 GPU owner，避免重复执行。</p></div></div><div class="component-list">${[['TaskPaw Hub','主控编排、现有机群监控、队列、确认与历史','主控'],['Miko 适配组件','每片执行完整后处理；整理 NFO、字幕及最终封面标识，包含适用的 folder.jpg','仅主控'],['Filmpaw 适配组件','演员位置索引、NAS 安全归档与完整回执','仅主控'],['TaskPaw Agent / Worker','本机 LTX、字幕、资源与阶段日志；远端只装这一层','每台计算机']].map(([name,desc,scope])=>`<div class="panel component-row"><div><h3>${name}</h3><p>${scope}</p></div><div><p>${desc}</p></div><span class="chip blue">安装器管理 · 设计</span></div>`).join('')}</div><div class="actions spacer-top">${v2Button('查看组件预检 / 回滚预览','component-check','','ghost')}${v2Button('工作流目录与规则','workflow-settings','','primary')}</div>`}`}
function deviceReason(d){if(d.quarantined)return d.reconciled?'已隔离且旧 owner 已核对；仍需新配对及核验才恢复领取':'新领取权限已撤销；旧 owner / 任务与历史保留，须受限核对';if(!d.verified)return d.paired?'待验证候选：声明与探测分开保存，尚无领取资格':'待配对候选：未核验，不补造探测结果，无领取资格';if(d.active&&!d.draining&&!d.unknown&&d.online)return'有在途任务：当前 GPU owner 保留，不重复领取第二个计算任务';if(d.retired)return'已退休；历史、回执、事件与通知记录保留';if(d.unknown)return'执行结果未知：先核对远端进程与 owner，不得删除或重派';if(!d.online)return'节点离线，禁止新领取；离线不代表在途进程已停止';if(!d.paired||d.credential!=='active')return'凭据未激活 / 已撤销；须重新配对';if(!d.verified)return'硬件或 profile 未核验，不具备领取资格';if(d.draining)return d.active?'排空中：在途任务继续，拒绝新领取':'已排空：可停用并撤销凭据';if(!d.enabled)return'已停用；需重新配对和核验才能重新启用';return deviceEligible(d)?'配对、硬件与 profile 均通过；允许按核验能力领取':'准入检查未通过'}
function managedCard(d){return `<article class="panel device-card" data-device="${d.id}"><div class="device-top"><div><h3>${esc(d.name)}</h3><p class="small muted">${d.id} · ${esc(d.address)}:${esc(d.port)}</p></div><span class="chip ${d.unknown?'red':deviceEligible(d)?'green':'amber'}">${d.quarantined?'已隔离 · 领取已撤销':!d.verified?'待配对 / 待验证':d.unknown?'执行未知':d.active&&!d.draining?'执行中':d.draining?'排空中':!d.enabled?'已停用':deviceEligible(d)?'允许领取':'禁止领取'}</span></div><div class="hardware-summary"><div><label>${d.verified?'GPU / 已核验显存':'GPU / 显存声明（未核验）'}</label><strong>${esc(d.gpu)}</strong><p class="small muted">${d.vramNumber} GB</p></div><div><label>系统内存</label><strong>${d.ram} GB</strong><p class="small muted">${d.verified?'核验值':'声明值，未批准'}</p></div><div><label>${d.verified?'工作区可用':'工作区空间声明'}</label><strong>${d.free} GB</strong><p class="small muted">${esc(d.workRoot)}</p></div></div><div class="chips"><span class="chip ${d.requested4k&&d.profile4k&&d.vramNumber>=16?'blue':''}">${!d.verified?'能力待验证，未批准':d.requested4k&&d.profile4k&&d.vramNumber>=16?'1080p + 4K 已验证':'仅 1080p'}</span><span class="chip">${d.active?'有在途任务':'无在途任务'}</span><span class="chip">${d.local?'本机 Agent · 不可在此退役主控':'远端 Agent'}</span></div><p class="lifecycle">${deviceReason(d)}</p><div class="device-controls">${v2Button('编辑','device-edit',`data-id="${d.id}"`,'ghost')}${v2Button('排空','device-drain',`data-id="${d.id}" ${d.draining?'disabled':''}`,'ghost')}${v2Button('隔离 / 撤销新领取','device-isolate',`data-id="${d.id}" ${d.quarantined?'disabled':''}`,'ghost')}${v2Button('停用 / 撤销','device-disable',`data-id="${d.id}" ${!d.enabled&&d.credential==='revoked'?'disabled':''}`,'ghost')}${v2Button('移除（保留历史）','device-remove',`data-id="${d.id}" ${d.local?'disabled':''}`,'danger')}${v2Button('演示状态','device-state',`data-id="${d.id}"`,'ghost')}</div></article>`}
function deviceManagement(){return v2Heading('管理设备','扩展现有 Hub“管理”页：网络配对 + 核验硬件 + 工作流准入。这里与影片工作区“设备”共用一份注册表。',v2Button('+ 添加设备','device-add','','primary'))+`<div class="notice">${icon('shield')}<div>手工录入只是声明。加入可领取池前须核对网络身份、原生硬件和已验证 profile。8 GB 不接受 4K；离线、未配对或硬件不符均不能领取。</div></div><div class="toolbar"><div class="chips"><span class="chip">${activeRegistry().length} 台注册</span><span class="chip green">${activeRegistry().filter(deviceEligible).length} 台可领取</span><span class="chip">初始五机，可按需增减</span></div><span class="small muted">地址均为 .invalid 演示名称</span></div><div class="v2-device-grid">${activeRegistry().map(managedCard).join('')}</div><section class="panel spacer-top"><div class="panel-head"><h2>退休记录 · 历史保留</h2><span class="chip">${registry.filter(d=>d.retired).length}</span></div><div class="panel-body">${registry.filter(d=>d.retired).map(d=>`<div class="retired-row"><strong>${esc(d.name)} · ${d.id}</strong><p>凭据已撤销，退出领取池；任务、状态证据、事件、入库回执与 outbox 关联未删除。</p></div>`).join('')||'<p class="small muted">尚无退休设备。此设计不能直接调用现有破坏性 remove_server 删除历史。</p>'}</div></section>`}

// Fixture-only, in-memory like the rest of the prototype.
const tierOrder=['standard','good','high'];
const tierShort={standard:'标准',good:'良好',high:'高'};
const tierLong={standard:'标准画质',good:'良好画质',high:'高画质'};
const localMachine={id:'local',label:'本机 · RTX 5070 Ti 16 GB',reason:'RTX 5070 Ti 16 GB'};
const lifeSteps=['入库扫描','待处理','修复','识别','翻译','回传','整理','待确认','归档','清理','完成'];
const lifeIndex={receiving:0,pending:1,inbox:2,encode:2,denoise:2,stopped:2,asr:3,translate:4,return:5,scrape:6,match:6,postprocess_error:6,ready:7,multi:7,nomatch:7,offline:7,permission:7,duplicate:7,unknown:8,cleanup:9,completed:10};
let pendingRerender=false,pendingFocus=null;
[
{id:'F19',title:'星河之外',resolution:'4K',actor:'演员星河',duration:'2:08:14',size:'41.6 GB',files:3,needsGpu:true,rec:{tier:'high',reason:'演员星河 上次选择 高画质'}},
{id:'F20',title:'晨雾车站',resolution:'1080p',actor:'演员晨雾',duration:'1:57:40',size:'6.8 GB',files:2,needsGpu:true,rec:{tier:'standard',reason:'默认'}},
{id:'F21',title:'旧城午后',resolution:'4K',actor:'演员旧城',duration:'2:21:05',size:'38.2 GB',files:4,needsGpu:true,rec:{tier:'standard',reason:'默认'}},
{id:'F22',title:'纸上潮汐',resolution:'1080p',actor:'演员潮汐',duration:'1:49:12',size:'9.4 GB',files:3,needsGpu:false,rec:{tier:null,reason:''}},
{id:'F23',title:'回声小巷',resolution:'1080p',actor:'演员回声',duration:'2:02:33',size:'7.1 GB',files:2,needsGpu:true,stale:true,rec:{tier:'good',reason:'演员回声 上次选择 良好画质'}},
{id:'F24',title:'夏至前夜',resolution:'4K',actor:'演员夏至',duration:'2:15:47',size:'44.9 GB',files:3,needsGpu:true,rec:{tier:'standard',reason:'默认'}}
].forEach(p=>fixtureFilms.push({...p,status:'pending',root:null,source:'INBOX',device:null,rec:{...p.rec,machine:'local'}}));
statusMeta.pending=['待处理','amber'];
shapes.pending='<path d="M3 6h13M3 11h13M3 16h7"/><path d="m14 17 3 3 5-6"/>';
pages.splice(1,0,['pending','待处理','pending']);
const pendingBaseInitial=initial;
initial=function(){const s=pendingBaseInitial();s.pendingFilter='all';s.films.forEach(f=>{if(f.status==='pending')f.plan={tier:f.rec.tier,machine:f.rec.machine};else if(f.status==='receiving')f.plan=null;else f.plan={tier:f.id==='F08'?'high':f.id==='F04'?'good':'standard',machine:f.device||'local'}});return s};
function pendingFilms(){return state.films.filter(f=>f.status==='pending')}
function visiblePending(){const all=pendingFilms();return state.pendingFilter==='gpu'?all.filter(f=>f.needsGpu):state.pendingFilter==='nogpu'?all.filter(f=>!f.needsGpu):all}
function batchEligible(f){return !f.stale&&f.plan.tier===f.rec.tier&&f.plan.machine===f.rec.machine}
function machineLabel(id){if(id==='local')return localMachine.label;const d=devices.find(x=>x.id===id);return d?`${d.id} · ${d.gpu} ${d.vram}`:id}
function stepLine(f){const cur=lifeIndex[f.status]??-1;return `<ol class="step-line" aria-label="${esc(f.title)} 生命周期">${lifeSteps.map((s,i)=>i<cur?`<li class="done">${s}<span class="sr-only">（已完成）</span></li>`:i===cur?`<li class="current" aria-current="step">${s}</li>`:`<li>${s}</li>`).join('')}</ol>`}
function planFacts(f){if(f.status==='pending')return `<dt>画质</dt><dd>待安排 <span class="muted">· 推荐 ${f.needsGpu?tierLong[f.rec.tier]:'无需修复'}</span></dd><dt>设备</dt><dd>待安排 <span class="muted">· 推荐 ${localMachine.label}</span></dd>`;if(!f.plan)return '<dt>画质</dt><dd>待安排</dd><dt>设备</dt><dd>待安排</dd>';return `<dt>画质</dt><dd>${f.plan.tier?tierLong[f.plan.tier]:'无需修复'}</dd><dt>设备</dt><dd>${machineLabel(f.plan.machine)}</dd>`}
function pendingCard(f){const tid=`pt-${f.id}`;const tier=f.needsGpu?`<div class="plan-field"><span class="plan-label" id="tier-label-${f.id}">画质</span><div class="seg" role="radiogroup" aria-labelledby="tier-label-${f.id}" aria-describedby="tier-reason-${f.id}">${tierOrder.map(t=>`<button type="button" class="seg-opt" role="radio" aria-checked="${f.plan.tier===t}" tabindex="${f.plan.tier===t?0:-1}" data-action="pending-tier" data-id="${f.id}" data-tier="${t}">${tierShort[t]}${f.rec.tier===t?' <span class="rec-tag">推荐</span>':''}</button>`).join('')}</div><p class="plan-reason" id="tier-reason-${f.id}">${esc(f.rec.reason)}</p></div>`:`<div class="plan-field"><span class="plan-label">画质</span><span class="chip green">无需修复</span></div>`;const machine=`<div class="plan-field"><label class="plan-label" for="machine-${f.id}">设备</label><select id="machine-${f.id}" class="pending-machine" data-id="${f.id}" aria-describedby="machine-reason-${f.id}"><option value="local" ${f.plan.machine==='local'?'selected':''}>${localMachine.label}</option></select><p class="plan-reason" id="machine-reason-${f.id}">${localMachine.reason}</p></div>`;return `<article class="panel review-card pending-card" data-pending="${f.id}">${cover(f)}<div class="film-body"><div class="film-title"><h3 id="${tid}">${esc(f.title)}</h3><span class="chip">${f.resolution}</span></div><p>${f.id} · ${esc(f.actor)}</p><p class="tabular">${f.duration} · ${f.size} · ${f.files} 个文件</p>${f.stale?`<div class="notice amber" id="stale-${f.id}">${icon('alert')}<div>收件内容已更新，请重新查看后确认</div></div>`:''}</div><div class="plan">${tier}${machine}</div><div class="pending-foot">${button('查看详情','detail',`data-id="${f.id}" aria-describedby="${tid}"`,'ghost small')}${button('确认入队','pending-confirm',`data-id="${f.id}" aria-describedby="${f.stale?`stale-${f.id}`:tid}" ${f.stale?'disabled':''}`,'primary small')}</div></article>`}
function pendingPage(){const all=pendingFilms(),items=visiblePending(),eligible=items.filter(batchEligible);return heading('PLANNING / 待处理','先安排，再开工。','新收件的影片停在这里。看封面与信息，按推荐或自行选择画质和设备；确认后才进入影片队列。')+`<div class="toolbar pending-toolbar"><div class="filters pending-filters">${[['all','全部'],['gpu','需修复'],['nogpu','无需修复']].map(([v,l])=>`<button class="filter-pill" data-action="pending-filter" data-filter="${v}" aria-pressed="${state.pendingFilter===v}">${l}</button>`).join('')}<span class="chip">${items.length} 部影片</span></div>${button(`${icon('check')}全部按推荐确认`,'pending-confirm-all',eligible.length?'':'disabled','ghost')}</div>`+(items.length?`<div class="pending-grid">${items.map(pendingCard).join('')}</div>`:all.length?empty('当前筛选没有待处理影片','切换到“全部”查看其余待处理影片。'):empty('没有待处理影片','新投入 INBOX 的影片会先出现在这里。'))}
renderers.pending=pendingPage;
navHTML=function(){return pages.map(([key,label,ico])=>{const count=key==='pending'?pendingFilms().length:key==='review'?state.films.filter(f=>reviewStates.includes(f.status)).length:key==='exceptions'?state.films.filter(f=>exceptionStates.includes(f.status)).length:null;return `<a href="#${key}" data-nav="${key}" ${state.page===key?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${count!==null?`<span class="nav-count">${count}</span>`:''}</a>`}).join('')};
// Overview: 待处理 joins the flow strip (amber) and the "等待您的确认" stat.
const pendingBaseOverview=renderers.overview;
renderers.overview=function(){const t=document.createElement('template');t.innerHTML=pendingBaseOverview();const a=pendingFilms().length,b=state.films.filter(f=>reviewStates.includes(f.status)).length;const first=t.content.querySelector('.flow-strip .flow-stage');if(first)first.insertAdjacentHTML('afterend',`<button class="flow-stage attention" data-action="nav" data-page="pending"><span>待处理</span><b>${a}</b></button>`);const stat=[...t.content.querySelectorAll('.stat')].find(s=>s.querySelector('.label')?.textContent.startsWith('等待您的确认'));if(stat){stat.querySelector('strong').innerHTML=`${a+b}<em>部影片</em>`;stat.querySelector('.note').textContent=`${a} 部待安排 · ${b} 部待入库`}return t.innerHTML};
// Unconfirmed films are not in the film queue yet.
const pendingBaseMatches=matchesStage;matchesStage=function(f){return f.status!=='pending'&&pendingBaseMatches(f)};
// Lifecycle step line under the stage block of queue cards.
const pendingBaseCard=card;card=function(f){return pendingBaseCard(f).replace('<div class="card-foot">',`${stepLine(f)}<div class="card-foot">`)};
// Drawer: step line under the hero, plan rows in Facts, confirm action for pending films.
const pendingBaseDetail=detail;
detail=function(id){const f=film(id);if(f.status==='pending'&&f.stale){f.stale=false;pendingRerender=true;pendingFocus=`[data-pending="${id}"] [data-action="pending-confirm"]`}pendingBaseDetail(id);const d=$('#dialog');$('.detail-hero',d)?.insertAdjacentHTML('afterend',`<div class="detail-steps">${stepLine(f)}</div>`);$('.modal-body > dl.facts',d)?.insertAdjacentHTML('afterbegin',planFacts(f));if(f.status==='pending'){const n=$('.modal-body > .notice',d);if(n)n.lastElementChild.textContent='待处理 · 确认画质与设备后才进入影片队列。';const acts=$('.modal-foot .actions',d);if(acts)acts.innerHTML=button('关闭','close','','ghost')+button('确认入队','pending-confirm',`data-id="${id}"`,'primary')}};
$('#dialog').addEventListener('close',()=>{if(pendingRerender){pendingRerender=false;if(state.page==='pending')render()}if(pendingFocus){const el=$(pendingFocus);pendingFocus=null;if(el)el.focus()}});
function setTier(id,tier){const f=film(id);if(!f||!f.needsGpu)return;f.plan.tier=tier;document.querySelectorAll(`[data-pending="${id}"] .seg-opt`).forEach(b=>{const on=b.dataset.tier===tier;b.setAttribute('aria-checked',String(on));b.tabIndex=on?0:-1});refreshBatch()}
function refreshBatch(){const b=$('[data-action="pending-confirm-all"]');if(b)b.disabled=!visiblePending().some(batchEligible)}
function confirmPending(id){const f=film(id);if(!f||f.status!=='pending'||f.stale)return false;f.status='inbox';f.plan={...f.plan};return true}
function focusTarget(order,idx){const next=order[idx]||order[idx-1];if(!next)return '#main';return `[data-pending="${next}"] [data-action="pending-confirm"]:not(:disabled), [data-pending="${next}"] [data-action="detail"]`}
function applyFocus(sel,fromDialog){if(fromDialog){pendingFocus=sel;return}const el=$(sel);if(el)el.focus({preventScroll:sel==='#main'})}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(!a.startsWith('pending-'))return;const fromDialog=!!b.closest('#dialog');switch(a){case'pending-filter':state.pendingFilter=b.dataset.filter;render();$(`[data-action="pending-filter"][data-filter="${b.dataset.filter}"]`)?.focus();break;case'pending-tier':setTier(id,b.dataset.tier);break;case'pending-confirm':{const order=[...document.querySelectorAll('[data-pending]')].map(c=>c.dataset.pending),idx=order.indexOf(id),f=film(id);if(fromDialog)closeDialog();if(!confirmPending(id))break;render();toast(`${f.title} 已确认入队 · ${f.plan.tier?tierLong[f.plan.tier]:'无需修复'} · 本机`);if(state.page==='pending')applyFocus(focusTarget(order.filter(x=>x!==id),idx),fromDialog);break}case'pending-confirm-all':{const items=visiblePending(),ok=items.filter(batchEligible),skipped=items.length-ok.length;ok.forEach(f=>{f.plan={tier:f.rec.tier,machine:f.rec.machine};confirmPending(f.id)});render();toast(`已确认 ${ok.length} 部，进入影片队列${skipped?`。${skipped} 部已调整或需重新查看，请单独确认。`:''}`);applyFocus(focusTarget(visiblePending().map(f=>f.id),0),false);break}}});
document.addEventListener('keydown',event=>{const b=event.target.closest?.('.seg-opt');if(!b)return;const step={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[event.key];const idx=tierOrder.indexOf(b.dataset.tier);let next;if(step)next=(idx+step+tierOrder.length)%tierOrder.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tierOrder.length-1;else return;event.preventDefault();setTier(b.dataset.id,tierOrder[next]);b.parentElement.querySelector(`[data-tier="${tierOrder[next]}"]`)?.focus()});
document.addEventListener('change',event=>{const el=event.target;if(!el.classList?.contains('pending-machine'))return;const f=film(el.dataset.id);if(f){f.plan.machine=el.value;refreshBatch()}});
state=initial();{const h=location.hash.slice(1);if(renderers[h])state.page=h}render();
</script>
