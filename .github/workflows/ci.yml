name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Let a newer push cancel an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + typecheck (ruff, mypy · taskpaw_v3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Sync dev environment
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (scoped to taskpaw_v3)
        run: uv run mypy

  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        # Windows is the PRIMARY agent target (#143), so run the suite there too —
        # a single cheap entry (latest supported py) to catch path-separator /
        # encoding / process-handling regressions. Packaging (#126) stays separate.
        include:
          - os: windows-latest
            python-version: "3.12"
          # Catch Mac Hub/backend regressions, including the existing real
          # subprocess lifecycle tests, alongside Windows and Linux.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Sync dev environment
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Nonsecret native directory HANDLE and ACL diagnostics
        if: runner.os == 'Windows'
        continue-on-error: true
        run: uv run python -m taskpaw_v3.tests.windows_control_diagnostics

      - name: Build actual macOS upstream helper sidecar
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ''
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''
          APPLE_CERTIFICATE: ''
          APPLE_CERTIFICATE_PASSWORD: ''
        run: |
          uv sync --frozen --group dev --extra build --extra v3 --python 3.12
          uv run --python 3.12 python scripts/build.py --skip-tauri
      - name: Actual macOS shipped upstream helper only
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-darwin ;;
            x86_64) triple=x86_64-apple-darwin ;;
            *) exit 1 ;;
          esac
          export TASKPAW_TEST_UPSTREAM_BACKEND="$PWD/taskpaw_v3/src-tauri/binaries/taskpaw-backend-$triple"
          uv run --python 3.12 pytest -s taskpaw_v3/tests/test_upstream_isolation.py -k native_upstream_helper_only
      - name: Run tests (with V3 coverage report; no hard threshold yet)
        run: uv run --python ${{ matrix.python-version }} pytest --cov=taskpaw_v3 --cov-report=term-missing

  frontend:
    name: frontend build (V3 UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install + lint + test + build the V3 UI
        working-directory: taskpaw_v3/ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  shell:
    name: tauri shell (cargo test) + backend bundling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: astral-sh/setup-uv@v7
      - name: Linux webkit deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build backend sidecar (verifies the PyInstaller spec + places it for cargo)
        run: |
          uv sync --frozen --extra build --extra v3
          uv run python scripts/build.py --skip-tauri
      - name: Actual Linux shipped upstream helper only
        shell: bash
        run: |
          export TASKPAW_TEST_UPSTREAM_BACKEND="$PWD/taskpaw_v3/src-tauri/binaries/taskpaw-backend-x86_64-unknown-linux-gnu"
          uv run pytest -s taskpaw_v3/tests/test_upstream_isolation.py -k native_upstream_helper_only
      - name: "cargo test (shell logic — loopback validation, role)"
        working-directory: taskpaw_v3/src-tauri
        run: cargo test --locked

  # A REAL `tauri build` (#54): exercises externalBin resolution, the role/version
  # --config overrides, and packaging on every PR — which the shell job's
  # --skip-tauri never does. Linux .deb only (no AppImage tooling); not uploaded.
  bundle-smoke:
    name: bundle smoke (Linux tauri build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Linux webkit deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Install Python + build deps
        run: uv sync --frozen --extra build --extra v3
      - name: tauri build (sidecar + UI + .deb)
        env:
          TASKPAW_BUNDLE_TARGETS: deb
        run: uv run python scripts/build.py
      - name: Verify a .deb bundle was produced
        run: |
          ls -la taskpaw_v3/src-tauri/target/release/bundle/deb/*.deb

  windows-control-credentials:
    name: Windows local control credentials (Python → Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build real Windows backend sidecar for Tauri
        run: |
          uv sync --frozen --group dev --extra build --extra v3 --python 3.12
          uv run python scripts/build.py --skip-tauri
      - name: Actual Windows source, frozen preread and shipped upstream helper only
        shell: pwsh
        run: |
          $env:TASKPAW_TEST_UPSTREAM_BACKEND = Join-Path (Get-Location) 'taskpaw_v3/src-tauri/binaries/taskpaw-backend-x86_64-pc-windows-msvc.exe'
          $env:TASKPAW_TEST_UPSTREAM_PREREAD_FROZEN = '1'
          uv run --python 3.12 pytest -s taskpaw_v3/tests/test_upstream_isolation.py -k 'native_upstream_helper_only or windows_preread_backpressure'
      - name: Native Windows Rust tests
        working-directory: taskpaw_v3/src-tauri
        run: cargo test --locked
      - name: Nonsecret native directory HANDLE and ACL diagnostics
        continue-on-error: true
        run: uv run python -m taskpaw_v3.tests.windows_control_diagnostics
      - name: Python writer → Rust reader interop
        shell: pwsh
        run: |
          # Use Python's actual user Temp; RUNNER_TEMP's D: root may have an
          # unknown owner and must remain rejected by the production policy.
          $fixtureParent = uv run python -c "import tempfile; print(tempfile.gettempdir())"
          if ($LASTEXITCODE -ne 0) { throw "Python fixture parent unavailable" }
          $env:TASKPAW_TEST_CONTROL_FIXTURES = Join-Path $fixtureParent ("taskpaw-control-" + [guid]::NewGuid().ToString())
          try {
            uv run python -m taskpaw_v3.tests.windows_control_fixture
            if ($LASTEXITCODE -ne 0) { throw "Python control fixture generation failed" }
            Push-Location taskpaw_v3/src-tauri
            try {
              $result = cargo test --locked tests::windows_python_credential_interop -- --exact --ignored 2>&1
              $result | Write-Output
              if ($LASTEXITCODE -ne 0 -or ($result -join "`n") -notmatch '1 passed; 0 failed') {
                throw "The required Windows Python-to-Rust interop case did not execute successfully"
              }
            } finally { Pop-Location }
          } finally {
            if (Test-Path $env:TASKPAW_TEST_CONTROL_FIXTURES) { Remove-Item -Recurse -Force $env:TASKPAW_TEST_CONTROL_FIXTURES }
          }
