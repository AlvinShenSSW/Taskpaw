# TEMP diagnostic branch transport only. Never merge into main or R13.
name: I216 CI002 coverage-context diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/afk/i216-ci002-native-diag'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic helper revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: diagnostic-helper
          persist-credentials: false
      - name: Checkout exact immutable failing product
        uses: actions/checkout@v5
        with:
          ref: 1b8549368152d8f165d2c02992856d8f439c0b54
          path: product
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync exact product dev dependencies
        working-directory: product
        run: uv sync --frozen --group dev --python 3.12
      - name: Diagnose original full coverage context once
        working-directory: product
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-helper/scripts/ci002_context_probe.py'
          $out = Join-Path $env:RUNNER_TEMP 'i216-ci002-context-receipt'
          uv run --frozen --python 3.12 python $probe --product (Get-Location).Path --output $out
          exit $LASTEXITCODE
      - name: Upload bounded sanitized diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: i216-ci002-coverage-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/i216-ci002-context-receipt/*.json
          if-no-files-found: error
          retention-days: 14
