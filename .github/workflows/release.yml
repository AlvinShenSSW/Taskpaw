# Temporary diagnostic transport. NEVER MERGE into product branches.
name: R13 CI004 copied writer diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/afk/r13-ci004-native-diag'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic helper revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: diagnostic-helper
          persist-credentials: false
      - name: Checkout immutable product F
        uses: actions/checkout@v5
        with:
          ref: 3247dccdce661c25f34e891464099659b3845e6b
          path: product
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Sync exact product dev dependencies
        working-directory: product
        run: uv sync --frozen --group dev --python 3.12
      - name: Bounded reproduction and exception observation
        working-directory: product
        shell: pwsh
        run: |
          $probe = Join-Path $env:GITHUB_WORKSPACE 'diagnostic-helper/scripts/ci004_probe.py'
          $out = Join-Path $env:RUNNER_TEMP 'r13-ci004-receipt'
          uv run --frozen --python 3.12 python $probe --product (Get-Location).Path --output $out
          exit $LASTEXITCODE
      - name: Upload sanitized bounded JSON only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: r13-ci004-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r13-ci004-receipt/*.json
          if-no-files-found: error
          retention-days: 14
